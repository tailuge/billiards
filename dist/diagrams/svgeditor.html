<!doctype html>
<html lang="en">
  <head>
    <title>Three cushion research</title>
    <link rel="icon" type="image/png" href="../favicon.png" />
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="description"
      content="Set up a three cushion shot: move the balls, aim, and choose the spin, power and elevation."
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../css/ball-colors.css" />
    <style>
      :root {
        /* Shared by the power slider and the cue tip. */
        --cue-blue: #2b7bb9;

        /* The drawn extent of the table diagram: its 2:1 play area plus the
           rails, the viewBox generateBilliardTable() sets in svg.js. The table
           is drawn at this shape inside the 2:1 media body, so it is
           letterboxed left and right. */
        --table-aspect: 3.4048 / 2.0824;

        /* Panel frame width. A variable so the height budget below can
           subtract the borders it adds. */
        --bw: 1px;

        /* Fixed heights, so the two tables can fill exactly what the window has
           left over rather than what a guess leaves over. */
        --header-height: 1.25rem;
        --footer-height: 1rem;
        --title-height: 1rem;
        --gap: 2px;

        /* The spin and elevation widgets' box. --side-h is the length of the
           power slider beside them: the two widgets and the action row under
           them, stacked with the row gap between. */
        --widget-size: 6.3rem;
        --action-height: 1.5rem;
        --side-h: calc(
          2 * var(--widget-size) + var(--action-height) + 2 * var(--gap)
        );

        /* Viewport height. dvh where supported, so a mobile browser's
           collapsing/expanding chrome is tracked; vh everywhere else. */
        --vh: 100vh;

        /* Height main.layout works with: the viewport minus the fixed header
           and footer. */
        --main-h: calc(var(--vh) - var(--header-height) - var(--footer-height));

        /* Everything in the stack that is not media body: the two panel
           titles, the row gap and the panels' four horizontal borders. */
        --chrome-h: calc(2 * var(--title-height) + var(--gap) + 4 * var(--bw));

        /* Each media body is half of what is left. It is 2:1, so twice this
           height is the width the pair needs to fill --main-h. */
        --media-h: calc((var(--main-h) - var(--chrome-h)) / 2);

        /* The panel width that makes the two stacked panels exactly fill
           --main-h, plus their left/right borders. The panels take 100% of the
           window instead when that is narrower, so they never overflow. */
        --panel-w: calc(2 * var(--media-h) + 2 * var(--bw));
      }

      @supports (height: 100dvh) {
        :root {
          --vh: 100dvh;
        }
      }

      /* The visible height of the window is the budget: the page is exactly one
         window tall and never scrolls, and the two panels below are sized from
         the height left over so they fill it. Their width follows from that
         height, capped at the window's own width. */
      html,
      body {
        height: var(--vh);
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        margin: 0;
        padding: 0 1rem;
        background: #f0f0f0;
        color: #111;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      /* Fixed height, and a direct child of body, so the height budget above
         is exact: the two panels get everything below the header. */
      header {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        height: var(--header-height);
      }

      h1 {
        margin: 0;
        padding: 0;
        font-size: 0.6rem;
        line-height: 1.1;
        font-weight: 400;
        text-align: center;
      }

      /* Same fixed height as the header, and a direct child of body, so the
         height budget above stays exact. */
      footer {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        height: var(--footer-height);
        font-size: 0.6rem;
      }

      footer a {
        color: #1d5886;
      }

      main.layout {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: center;
        min-height: 0;
        gap: var(--gap);
      }

      .panel {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: #fff;
        border: var(--bw) solid #ddd;
        border-radius: 0.25rem;
      }

      /* The two media panels take the width that makes them exactly fill the
         height budget, or the window's width when that is narrower. */
      .panel-output,
      .panel-input {
        width: min(100%, var(--panel-w));
      }

      .panel > h2 {
        box-sizing: border-box;
        margin: 0;
        padding: 0 0.6rem;
        border-bottom: 1px solid #eee;
        color: #666;
        font-size: 0.7rem;
        font-weight: 600;
        height: var(--title-height);
        letter-spacing: 0.06em;
        line-height: var(--title-height);
        text-transform: uppercase;
      }

      /* The 2:1 media box: everything below the title. Its width sets its
         height, and the two panels are sized so these fill the window. */
      .panel-body {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 2 / 1;
        padding: 0;
        min-width: 0;
        overflow: hidden;
      }

      .table-panel {
        display: flex;
        min-width: 0;
        height: 100%;
      }

      /* The table at its own ~1.65:1 shape inside the 2:1 media body. The
         letterbox margins the viewBox leaves around the cloth are left
         unframed, so the table reads as the cloth alone. */
      svg.billiards-table {
        box-sizing: border-box;
        display: block;
        height: 100%;
        width: auto;
        max-width: 100%;
        aspect-ratio: var(--table-aspect);
        background: #fff;
        touch-action: none;
        user-select: none;
      }

      /* The input panel is the positioning context for the dialog laid over it,
         so the dialog stays off the replay panel above. */
      .panel-input {
        position: relative;
      }

      /* The 3D replay. diagram.js drives it from the .topview's data-state and
         sizes its canvas to the .topview box, so both fill this 2:1 body. */
      .replaydiagram,
      .topview {
        width: 100%;
        height: 100%;
        line-height: 0;
      }

      .replaydiagram {
        overflow: hidden;
        background: #000;
      }

      .topview canvas {
        display: block;
      }

      /* The action panel: the last row of the controls column, so its buttons
         sit centred below the elevation widget. */
      .action-panel {
        box-sizing: border-box;
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        height: var(--action-height);
      }

      /* A plain button, as the diagram pages use. */
      .action-button {
        font: inherit;
        font-size: 0.7rem;
        line-height: 1.2;
        padding: 0.2rem 0.8rem;
        background: #fff;
        color: #111;
        border: 1px solid #ccc;
        border-radius: 3px;
        cursor: pointer;
      }

      .action-button:hover {
        background: #f5f5f5;
      }

      /* The dialog is scoped to the input panel: absolute against it, so it
         dims and centres over the shot input without covering the replay
         above. */
      .modal-backdrop {
        box-sizing: border-box;
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgb(0 0 0 / 35%);
      }

      /* hidden beats the flex above, so the closed dialog takes no clicks. */
      .modal-backdrop[hidden] {
        display: none;
      }

      .modal {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        width: min(20rem, 80%);
        padding: 0.6rem 0.7rem;
        background: #fff;
        border: var(--bw) solid #ddd;
        border-radius: 0.25rem;
        box-shadow: 0 10px 30px rgb(0 0 0 / 25%);
        font-size: 0.7rem;
      }

      .modal-title {
        margin: 0;
        font-size: 0.7rem;
        font-weight: 600;
        color: #666;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      /* Which cushion the shot is played on: a pair of radios drawn as one
         control, so the arrow keys move between them as radios should. */
      .model-toggle {
        display: flex;
        margin: 0;
        padding: 0;
        border: 0;
      }

      .model-toggle label {
        flex: 1;
        cursor: pointer;
      }

      .model-toggle span {
        display: block;
        padding: 2px 0;
        border: 1px solid #ddd;
        background: #fff;
        color: #111;
        font-size: 0.7rem;
        text-align: center;
      }

      /* Joined in the middle, so the pair reads as one control. */
      .model-toggle label:first-of-type span {
        border-radius: 3px 0 0 3px;
      }

      .model-toggle label:last-of-type span {
        border-left: 0;
        border-radius: 0 3px 3px 0;
      }

      .model-toggle input:checked + span {
        border-color: #1d5886;
        background: var(--cue-blue);
        color: #fff;
      }

      .model-toggle input:focus-visible + span {
        outline: 2px solid #1d5886;
        outline-offset: 1px;
      }
      /* The constant groups, as three.html writes them. The diagram bundle's
         Sliders finds each input by id, seeds it from the launch parameters and
         drives the physics setters, so these need markup and nothing else --
         which is why the ids below are the constants' own names. */
      .constants {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      /* Hidden but still focusable, so a keyboard can open a group; the label
         is what the pointer and the keyboard both work against. The same trick
         hides the cushion model's radios and this legend. */
      .visually-hidden,
      .collapse-toggle,
      .model-toggle input {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .collapse-label {
        display: block;
        padding: 2px 4px;
        border: 1px solid #ddd;
        border-radius: 3px;
        background: #f5f5f5;
        color: #111;
        font-size: 0.7rem;
        text-align: center;
        cursor: pointer;
      }

      .collapse-toggle:focus-visible + .collapse-label {
        outline: 2px solid var(--cue-blue);
        outline-offset: 1px;
      }

      .collapse-content {
        display: none;
        padding-top: 2px;
      }

      .collapse-toggle:checked + .collapse-label + .collapse-content {
        display: block;
      }

      /* Sliders sets step 0.0001 and a range up from the value it seeds, so
         only the shape is styled here. */
      .constants input[type="range"] {
        width: 100%;
        height: 2px;
        margin: 1px 0;
        accent-color: var(--cue-blue);
      }

      .constant-row {
        color: #595959;
        font-size: 0.65rem;
      }

      /* Shot input: the table takes the left, the vertical power slider sits
         beside it, and the spin and elevation widgets stack down the right. The
         table viewBox letterboxes inside whatever room is left. */
      .panel-input .panel-body {
        justify-content: space-between;
        gap: 2px;
      }

      .panel-input .table-panel {
        flex: 1 1 auto;
      }

      .panel-input svg.billiards-table {
        width: 100%;
        height: 100%;
      }

      .shot-side {
        display: flex;
        flex: none;
        flex-direction: column;
        align-items: center;
        gap: var(--gap);
      }

      /* Carom ball colours; ball-colors.css is keyed to pool/snooker ids. */

      svg.billiards-table .ball-0 {
        --ball-fill: #fff;
        --ball-stroke: #333;
      }

      svg.billiards-table .ball-1 {
        --ball-fill: #ffd700;
        --ball-stroke: #a67c00;
      }

      svg.billiards-table .ball-2 {
        --ball-fill: #e63946;
        --ball-stroke: #8d1b25;
      }

      svg.billiards-table .ball {
        cursor: grab;
      }

      svg.billiards-table.dragging {
        cursor: grabbing;
      }

      svg.billiards-table.zoomed {
        cursor: grab;
      }

      svg.billiards-table .aim-line {
        stroke: #c2410c;
        stroke-width: 0.0025;
        stroke-linecap: round;
        stroke-opacity: 0.75;
      }

      svg.billiards-table .aim-head {
        fill: none;
        stroke: #c2410c;
        stroke-width: 0.002;
      }

      /* The ball as the cue sees it: one user unit is one ball radius, so an
         offset reads at its true size. */
      .spin-widget {
        box-sizing: border-box;
        flex: none;

        /* 1.05x the ball's 6rem, so padding the viewBox above did not shrink
           the ball itself. */
        width: var(--widget-size);
        height: var(--widget-size);
        cursor: crosshair;
        touch-action: none;
      }

      .spin-widget .spin-ball {
        fill: #fff;
        stroke: #333;
        stroke-width: 0.02;
      }

      .spin-widget .spin-limit {
        fill: none;
        stroke: #b91c1c;
        stroke-width: 0.016;
        stroke-dasharray: 0.06 0.05;
        stroke-opacity: 0.5;
      }

      /* Pinned to the miscue limit: the strike is no longer reproducible. */
      .spin-widget.at-limit .spin-limit {
        stroke-opacity: 1;
      }

      .spin-widget .spin-axis {
        stroke: #bbb;
        stroke-width: 0.016;
      }

      .spin-widget .spin-dot {
        fill: var(--cue-blue);
        fill-opacity: 0.85;
        stroke: #1d5886;
        stroke-width: 0.016;
      }

      /* The measured offset, one coordinate per line, riding above and to the
         right of the tip and flipping to its left near the widget edge so it
         never clips. The padding in the viewBox is what gives it the room to
         sit outside the ball. */
      .spin-widget .spin-readout {
        fill: #333;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.15px;
        pointer-events: none;
      }

      /* Vertical and full at the top, as in three.html. Its length matches the
         controls column beside it, so the slider and the stack read as one
         column of the same height. */
      #power {
        box-sizing: border-box;
        accent-color: var(--cue-blue);
        writing-mode: vertical-lr;
        direction: rtl;
        flex: none;
        width: 1.1rem;
        height: var(--side-h);
        margin: 0;
      }

      /* The cue seen from the side: one line pivoting about the bottom-left,
         the same drag the main game's angle-input uses. 0deg is a flat cue and
         the widget's own bottom edge is the cloth it is measured against. */
      .elevation-widget {
        box-sizing: border-box;
        flex: none;
        width: var(--widget-size);
        height: var(--widget-size);
        cursor: grab;
        touch-action: none;
      }

      .elevation-widget:active {
        cursor: grabbing;
      }

      .elevation-widget .elevation-line {
        stroke: #333;
        stroke-width: 1.2;
        stroke-linecap: round;
      }

      /* The cue's full sweep, always shown, and the cue held at its 72 degree
         cap as a dashed line, so the drag's range is visible up front. */
      .elevation-widget .elevation-arc {
        fill: none;
        stroke: #c0c6cc;
        stroke-width: 1;
      }

      .elevation-widget .elevation-max {
        stroke: #8a9199;
        stroke-width: 1;
        stroke-dasharray: 3 2;
        stroke-linecap: round;
      }

      /* The measured angle, centred in the widget. Stroked white underneath so
         it stays legible where the cue line crosses it. */
      .elevation-widget .elevation-readout {
        fill: #111;
        stroke: #fff;
        stroke-width: 3px;
        stroke-linejoin: round;
        paint-order: stroke;
        font-size: 12px;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
      }

      /* Phones: one column in the reading order above, natural height and
         normal scrolling. Narrower than this the pair cannot usefully fit a
         window anyway. */
      @media (width <= 40rem) {
        html,
        body {
          height: auto;
          overflow: visible;
        }

        body {
          padding-bottom: 2px;
        }

        header {
          height: auto;
          padding: 2px 0 0;
        }

        /* The page scrolls, so the tables drop the height budget and simply
           take the full width of the window, staying 2:1. */
        .panel-output,
        .panel-input {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Three cushion research</h1>
    </header>

    <main class="layout">
      <!-- Order matters: the simulation output sits above the table it is
           plotted from, and the flow follows the markup. -->
      <section class="panel panel-output" aria-label="Simulation output">
        <h2>simulation output</h2>
        <!-- The diagram bundle's contract, as three.html writes it: a
             .replaydiagram holding a .topview whose data-state it reads. The
             editor fills that state in; the bundle owns everything below. -->
        <div class="panel-body">
          <div class="replaydiagram">
            <div class="topview"></div>
          </div>
        </div>
      </section>

      <section class="panel panel-input" aria-label="Shot input">
        <h2>shot input</h2>
        <div class="panel-body">
          <div class="table-panel">
            <svg class="billiards-table threecushion"></svg>
          </div>
          <input
            id="power"
            type="range"
            min="0"
            max="1"
            step="0.01"
            aria-label="Power"
          />
          <div class="shot-side">
            <!-- ViewBox is padded past the ball so the ball's outline, which is
                 stroked across r=1, is not clipped by the viewport edge. -->
            <svg
              class="spin-widget"
              viewBox="-1.05 -1.05 2.1 2.1"
              role="img"
              aria-label="Cue tip contact point on the cue ball"
            >
              <circle class="spin-ball" r="1" />
              <circle class="spin-limit" r="0.45" />
              <line class="spin-axis" x1="-0.5" y1="0" x2="0.5" y2="0" />
              <line class="spin-axis" x1="0" y1="-0.5" x2="0" y2="0.5" />
              <circle class="spin-dot" r="0.15" />
              <text class="spin-readout" aria-hidden="true">
                <tspan></tspan>
                <tspan></tspan>
              </text>
            </svg>
            <svg
              class="elevation-widget"
              viewBox="0 0 100 100"
              role="slider"
              aria-label="Cue elevation in degrees"
              aria-valuemin="0"
              aria-valuemax="72"
              aria-valuenow="0"
            >
              <!-- The path the cue tip sweeps, and the cue at its 72 degree cap.
                   Both are placed from the same pivot, length and cap that drive
                   the cue line, so they follow the constants. -->
              <path class="elevation-arc" />
              <line class="elevation-max" x1="12" y1="88" />
              <line class="elevation-line" x1="12" y1="88" x2="92.75" y2="88" />
              <text
                class="elevation-readout"
                x="50"
                y="50"
                aria-hidden="true"
              />
            </svg>
            <!-- Centred under the elevation widget, as the bottom row of the
                 controls column. -->
            <div class="action-panel">
              <button
                id="action"
                class="action-button"
                type="button"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-controls="action-modal"
              >
                action
              </button>
              <!-- The diagram bundle relabels this and binds the re-run once
                   its assets are in, so it is the editor's only way to replay. -->
              <button id="replay" class="action-button" type="button">
                replay
              </button>
            </div>
          </div>
        </div>

        <!-- Inside the input panel rather than over the window: absolute
             against this panel, so opening the dialog leaves the replay above
             it untouched. -->
        <div class="modal-backdrop" id="action-modal" hidden>
          <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-label="Action"
          >
            <h2 class="modal-title">action</h2>
            <!-- Which cushion the shot is played on. It rides in the state, so
                 the replay, a share link and the launch links all follow it;
                 the constants below are left for the sliders to set. -->
            <fieldset class="model-toggle">
              <legend class="visually-hidden">Cushion model</legend>
              <label>
                <input
                  type="radio"
                  name="cushionModel"
                  value="mathavan"
                  checked
                />
                <span>Mathavan</span>
              </label>
              <label>
                <input type="radio" name="cushionModel" value="stronge" />
                <span>Stronge</span>
              </label>
            </fieldset>
            <!-- The physics constants, grouped as three.html groups them. The
                 empty labels are filled in by the bundle with each constant's
                 name and current value. -->
            <div id="constants" class="constants">
              <div class="constant-group">
                <input
                  type="checkbox"
                  id="mathavan-toggle"
                  class="collapse-toggle"
                />
                <label for="mathavan-toggle" class="collapse-label"
                  >Mathavan</label
                >
                <div class="collapse-content">
                  <input id="μs" type="range" aria-label="Mathavan μs" />
                  <div class="constant-row">
                    Mathavan <label for="μs"></label>
                  </div>
                  <input id="μw" type="range" aria-label="Mathavan μw" />
                  <div class="constant-row">
                    Mathavan <label for="μw"></label>
                  </div>
                  <input
                    id="ee"
                    type="range"
                    aria-label="Cushion restitution"
                  />
                  <div class="constant-row">
                    Cushion restitution <label for="ee"></label>
                  </div>
                </div>
              </div>
              <div class="constant-group">
                <input
                  type="checkbox"
                  id="han-toggle"
                  class="collapse-toggle"
                />
                <label for="han-toggle" class="collapse-label">Han</label>
                <div class="collapse-content">
                  <input
                    id="mu"
                    type="range"
                    aria-label="Han rolling friction"
                  />
                  <div class="constant-row">
                    Han rolling friction <label for="mu"></label>
                  </div>
                  <input
                    id="muS"
                    type="range"
                    aria-label="Han sliding friction"
                  />
                  <div class="constant-row">
                    Han sliding friction <label for="muS"></label>
                  </div>
                </div>
              </div>
              <div class="constant-group">
                <input
                  type="checkbox"
                  id="stronge-toggle"
                  class="collapse-toggle"
                />
                <label for="stronge-toggle" class="collapse-label"
                  >Stronge</label
                >
                <div class="collapse-content">
                  <input
                    id="stronge_omega_ratio"
                    type="range"
                    aria-label="Stronge ω ratio"
                  />
                  <div class="constant-row">
                    Stronge ω ratio <label for="stronge_omega_ratio"></label>
                  </div>
                  <input
                    id="stronge_e_n"
                    type="range"
                    aria-label="Stronge normal restitution"
                  />
                  <div class="constant-row">
                    Stronge eₙ <label for="stronge_e_n"></label>
                  </div>
                  <input id="stronge_μ" type="range" aria-label="Stronge μ" />
                  <div class="constant-row">
                    Stronge μ <label for="stronge_μ"></label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <a href="../lobby.html">lobby</a>
      <a href="https://github.com/tailuge/billiards">github</a>
    </footer>

    <!-- The 3D replay's bundle and the chunks it shares globals with. Deferred
         and in document order, so they are in place before the editor's own
         module runs and before DOMContentLoaded fires their listener.
         interact.js is in three.html's list but the build does not emit it. -->
    <script defer src="../three_core.js"></script>
    <script defer src="../three_module.js"></script>
    <script defer src="../three_examples.js"></script>
    <script defer src="../messaging.js"></script>
    <script defer src="../diagram.js"></script>

    <script type="module">
      import {
        generateBilliardTable,
        renderBallPositions,
        setupSvgRoot,
        toSvgCoords,
        R,
        SVG_NS,
        X,
        Y,
      } from "./svg.js"
      import {
        DEFAULT_CUSHION_MODEL,
        readState,
        serializeState,
      } from "./editor-state.js"

      // The shot to open on: the editor's own default, or the one a launch
      // parameter or a share link carries. editor-state.js owns the shape,
      // which is the one three.html carries in its data-state, so the same
      // string can later drive the replay and the launch links.
      // Table coordinates are in metres with y pointing up; svg.js renders a
      // ball at (x, -y).
      const state = readState(new URLSearchParams(window.location.search))
      const balls = state.balls.map((ball, id) => ({ id, ...ball }))

      const BOUND_X = X - R
      const BOUND_Y = Y - R
      const MIN_GAP = 2 * R

      // Aim is a direction plus a drawn length, as in three.html. The length is
      // cosmetic: the tip is held at the cushion whatever the pointer distance.
      const CUE_BALL = 0
      const DEFAULT_AIM_LENGTH = 86 * R

      // Grabbing keeps ~16 screen px of slack around a ball when zoomed out and
      // narrows to the ball's own radius once the ball is large on screen.
      const HIT_PX = 16
      const MAX_ZOOM = 12
      const ZOOM_STEP = 0.0015

      const svg = document.querySelector(".billiards-table")
      const { tableGroup, trajectoriesGroup, ballsGroup, statusEl } =
        setupSvgRoot(svg)
      // Tighter than the shared default so the cloth fills more of the canvas.
      // The bottom pad still has to clear the status line, whose baseline is
      // STATUS_TEXT_DROP below the frame, so it stays at the default 0.2 and
      // only the left/right/top margin is cut.
      const table = generateBilliardTable({ pad: 0.2, halfPad: 0.01 })

      const baseView = parseViewBox(table.viewBox)
      let view = { ...baseView }

      svg.setAttribute("viewBox", table.viewBox)
      tableGroup.innerHTML = table.content

      renderBallPositions(ballsGroup, {
        balls: balls.map(({ id, x, y }) => ({ id, pos: { x, y } })),
      })

      const circles = [...ballsGroup.querySelectorAll(".ball")]
      const clamp = (value, min, max) => Math.min(max, Math.max(min, value))

      // The status line under the table doubles as the readout: the hint, then
      // the two numbers a shot is defined by once spin and elevation are set on
      // their own widgets.
      const STATUS_HINT = "drag balls, scroll or pinch to zoom"

      function renderStatus() {
        const degrees = (normalizeAngle(aimAngle) * 180) / Math.PI
        statusEl.textContent =
          `${STATUS_HINT} · ${degrees.toFixed(1)} deg, ` +
          `${power.toFixed(2)} m/s`
      }

      // --- view: wheel zoom about the pointer, cloth drag to pan ---

      function parseViewBox(value) {
        const [x, y, width, height] = value.split(/\s+/).map(Number)
        return { x, y, width, height }
      }

      function clampView() {
        view.x = clamp(
          view.x,
          baseView.x,
          baseView.x + baseView.width - view.width
        )
        view.y = clamp(
          view.y,
          baseView.y,
          baseView.y + baseView.height - view.height
        )
      }

      function applyView() {
        clampView()
        const zoom = baseView.width / view.width
        svg.setAttribute(
          "viewBox",
          `${view.x} ${view.y} ${view.width} ${view.height}`
        )
        svg.classList.toggle("zoomed", zoom > 1)
      }

      function zoomAt(point, factor) {
        const zoom = baseView.width / view.width
        const next = clamp(zoom * factor, 1, MAX_ZOOM)
        const ratio = zoom / next
        view.width = baseView.width / next
        view.height = baseView.height / next
        view.x = point.x + (view.x - point.x) * ratio
        view.y = point.y + (view.y - point.y) * ratio
        applyView()
      }

      function resetView() {
        view = { ...baseView }
        applyView()
      }

      svg.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault()
          // deltaMode 1 counts lines instead of pixels (Firefox, some mice).
          const delta = event.deltaMode === 1 ? event.deltaY * 33 : event.deltaY
          zoomAt(toSvgCoords(svg, event), Math.exp(-delta * ZOOM_STEP))
        },
        { passive: false }
      )

      // The controls panel is gone, so the table's own double-tap is the only
      // way back to the full table. It fires on touch as well as with a mouse.

      // --- moving balls ---

      // toSvgCoords returns SVG user space (y down); the model keeps y up.
      function toModelPoint(event) {
        const { x, y } = toSvgCoords(svg, event)
        return { x, y: -y }
      }

      function hitRadius() {
        const matrix = svg.getScreenCTM()
        if (!matrix) return R
        return Math.max(R, HIT_PX / Math.abs(matrix.a))
      }

      function findBall(point) {
        const radius = hitRadius()
        let found = null
        balls.forEach((ball, index) => {
          const distance = Math.hypot(ball.x - point.x, ball.y - point.y)
          if (distance > radius) return
          if (found === null || distance < found.distance) {
            found = { index, distance }
          }
        })
        return found
      }

      // --- aim: the dot at the tip of the line sets the direction ---

      let aimAngle = normalizeAngle(state.shot.angle)
      let aimLength = DEFAULT_AIM_LENGTH
      let aimTip = { x: 0, y: 0 }
      let draggingAim = false
      let aimGrab = { x: 0, y: 0 }

      const aimLine = document.createElementNS(SVG_NS, "line")
      aimLine.setAttribute("class", "aim-line")
      const aimHead = document.createElementNS(SVG_NS, "circle")
      aimHead.setAttribute("class", "aim-head")
      aimHead.setAttribute("r", String(R))
      // Drawn under the balls so the cue ball stays visible on top of the line.
      trajectoriesGroup.append(aimLine, aimHead)

      function normalizeAngle(angle) {
        const tau = Math.PI * 2
        return ((angle % tau) + tau) % tau
      }

      // Distance from (x, y) to the edge of a box along `angle`. Measuring
      // against the play area inset by R gives the point where the cue ball is
      // just touching a rail, so the aim dot marks real contact.
      function distanceToEdge(x, y, angle, halfWidth, halfHeight) {
        const dx = Math.cos(angle)
        const dy = Math.sin(angle)
        const distances = []
        if (dx > 0) distances.push((halfWidth - x) / dx)
        else if (dx < 0) distances.push((-halfWidth - x) / dx)
        if (dy > 0) distances.push((halfHeight - y) / dy)
        else if (dy < 0) distances.push((-halfHeight - y) / dy)
        const positive = distances.filter((distance) => distance >= 0)
        if (positive.length === 0) return 0
        return Math.min(...positive)
      }

      function renderAim() {
        const cue = balls[CUE_BALL]
        const limit = distanceToEdge(cue.x, cue.y, aimAngle, BOUND_X, BOUND_Y)
        const length = Math.min(aimLength, limit)
        aimTip = {
          x: cue.x + Math.cos(aimAngle) * length,
          y: cue.y + Math.sin(aimAngle) * length,
        }
        aimLine.setAttribute("x1", String(cue.x))
        aimLine.setAttribute("y1", String(-cue.y))
        aimLine.setAttribute("x2", String(aimTip.x))
        aimLine.setAttribute("y2", String(-aimTip.y))
        aimHead.setAttribute("cx", String(aimTip.x))
        aimHead.setAttribute("cy", String(-aimTip.y))
        const degrees = (normalizeAngle(aimAngle) * 180) / Math.PI
        renderStatus()
        syncDiagram()
      }

      // The pointer target is the aim point; the angle is measured from the cue
      // ball in model space, so it matches three.html's shot angle.
      function setAim(point) {
        const cue = balls[CUE_BALL]
        const dx = point.x - cue.x
        const dy = point.y - cue.y
        aimAngle = normalizeAngle(Math.atan2(dy, dx))
        aimLength = Math.hypot(dx, dy)
        renderAim()
      }

      // --- spin: where the cue tip contacts the cue ball ---

      // Offset is in units of R, the same as three.html's shots[].offset, and
      // lives in the cue's own frame: y is the vertical hit (follow or draw),
      // x the lateral one. It is therefore unaffected by the aim direction or
      // the cue ball's position. x is mirrored on screen, the same way
      // three.html places its cue tip and svg.js draws renderInset.
      const SPIN_LIMIT = 0.45
      const spin = clampSpin(state.shot.offset.x, state.shot.offset.y)
      const spinWidget = document.querySelector(".spin-widget")
      const spinDot = spinWidget.querySelector(".spin-dot")
      const spinReadout = spinWidget.querySelector(".spin-readout")

      function clampSpin(x, y) {
        const length = Math.hypot(x, y)
        if (length <= SPIN_LIMIT || length === 0) return { x, y }
        const scale = SPIN_LIMIT / length
        return { x: x * scale, y: y * scale }
      }

      function signed(value) {
        return `${value < 0 ? "-" : "+"}${Math.abs(value).toFixed(2)}`
      }

      // The readout rides just off the tip, on whichever side has room inside
      // the padded viewBox, so it never clips against the widget edge. The
      // monospace advance is 0.6em, which is what the offset maths needs.
      const READOUT_FONT = 0.15
      const READOUT_ADVANCE = 0.6
      const READOUT_GAP = 0.2
      const READOUT_LEADING = 0.2
      const spinLines = [...spinReadout.querySelectorAll("tspan")]

      function renderSpin() {
        spinDot.setAttribute("cx", String(-spin.x))
        spinDot.setAttribute("cy", String(-spin.y))
        const atLimit = Math.hypot(spin.x, spin.y) >= SPIN_LIMIT - 1e-9
        spinWidget.classList.toggle("at-limit", atLimit)

        // The dot is drawn at (-x, -y): x is mirrored, y is not.
        const tipX = -spin.x
        const tipY = -spin.y
        const xLabel = `x ${signed(spin.x)}`
        const yLabel = `y ${signed(spin.y)}`
        // The padded viewBox runs to 1.05; the longest label sets the fit.
        const width = xLabel.length * READOUT_FONT * READOUT_ADVANCE
        const onRight = tipX + READOUT_GAP + width <= 1.05
        const left = tipX + (onRight ? READOUT_GAP : -READOUT_GAP)
        const top = clamp(tipY - READOUT_GAP, -1.05 + READOUT_LEADING, 1.05)
        spinReadout.setAttribute("x", String(left))
        spinReadout.setAttribute("text-anchor", onRight ? "start" : "end")
        // Each line carries its own x, so the second wraps rather than
        // continuing on from the first.
        spinLines[0].setAttribute("x", String(left))
        spinLines[0].textContent = xLabel
        spinLines[1].setAttribute("x", String(left))
        spinLines[1].setAttribute("dy", String(READOUT_LEADING))
        spinLines[1].textContent = yLabel
        spinReadout.setAttribute("y", String(top - READOUT_LEADING))
        syncDiagram()
      }

      function setSpin(x, y) {
        const next = clampSpin(x, y)
        spin.x = next.x
        spin.y = next.y
        renderSpin()
      }

      let draggingSpin = false

      // Widget space is the viewBox, in units of R with y down, so both axes
      // are negated on the way to the model offset. Reading the viewBox rather
      // than assuming -1..1 keeps the mapping right despite its padding.
      function spinFromPointer(event) {
        const rect = spinWidget.getBoundingClientRect()
        const view = spinWidget.viewBox.baseVal
        if (rect.width === 0 || rect.height === 0 || view.width === 0) return
        const userX =
          view.x + ((event.clientX - rect.left) / rect.width) * view.width
        const userY =
          view.y + ((event.clientY - rect.top) / rect.height) * view.height
        setSpin(-userX, -userY)
      }

      spinWidget.addEventListener("pointerdown", (event) => {
        draggingSpin = true
        spinWidget.setPointerCapture(event.pointerId)
        spinFromPointer(event)
        event.preventDefault()
      })

      spinWidget.addEventListener("pointermove", (event) => {
        if (!draggingSpin) return
        spinFromPointer(event)
        event.preventDefault()
      })

      function endSpin(event) {
        if (!draggingSpin) return
        draggingSpin = false
        if (spinWidget.hasPointerCapture(event.pointerId)) {
          spinWidget.releasePointerCapture(event.pointerId)
        }
      }

      spinWidget.addEventListener("pointerup", endSpin)
      spinWidget.addEventListener("pointercancel", endSpin)

      function resetSpin() {
        setSpin(0, 0)
      }
      spinWidget.addEventListener("dblclick", resetSpin)

      // --- power: how fast the cue ball leaves the tip ---

      // The slider is a fraction of three.html's MAX_POWER, so a given slider
      // position is the same shot in both pages. The value is metres per
      // second, matching the power field in the ?state= shots.
      const MAX_POWER = 160 * R
      const DEFAULT_POWER = state.shot.power
      const powerInput = document.getElementById("power")
      let power = DEFAULT_POWER

      function renderPower() {
        powerInput.value = String(power / MAX_POWER)
        renderStatus()
        syncDiagram()
      }

      // The handler reads the slider without writing it back, so it cannot
      // fight the thumb while the pointer is driving it.
      powerInput.addEventListener("input", (event) => {
        power = clamp(Number(event.target.value) * MAX_POWER, 0, MAX_POWER)
        renderStatus()
        syncDiagram()
      })

      // --- elevation: how far the cue is raised off the cloth ---

      // Same drag as the main game's angle-input: the pointer's bearing from a
      // pivot inset 12% from the bottom-left of the widget, y measured upwards.
      // Clamped to the 72 degrees that input advertises as its maximum, and
      // held in radians, the unit cueStrike and the ?state= shots both take.
      const MAX_ELEVATION = (2 * Math.PI) / 5
      const ELEVATION_PIVOT = { x: 12, y: 88 }
      const ELEVATION_LENGTH = 80.75
      const elevationWidget = document.querySelector(".elevation-widget")
      const elevationLine = elevationWidget.querySelector(".elevation-line")
      const elevationArc = elevationWidget.querySelector(".elevation-arc")
      const elevationMax = elevationWidget.querySelector(".elevation-max")
      const elevationReadout =
        elevationWidget.querySelector(".elevation-readout")
      let elevation = clamp(state.shot.elevation, 0, MAX_ELEVATION)

      // The sweep guide and the cap line never move, so they are placed once
      // from the same pivot, length and cap that drive the cue.
      function renderElevationGuides() {
        const flatTipX = ELEVATION_PIVOT.x + ELEVATION_LENGTH
        const maxTipX =
          ELEVATION_PIVOT.x + Math.cos(MAX_ELEVATION) * ELEVATION_LENGTH
        const maxTipY =
          ELEVATION_PIVOT.y - Math.sin(MAX_ELEVATION) * ELEVATION_LENGTH
        // Sweep flag 0 draws counter-clockwise on screen, as the cue rises.
        elevationArc.setAttribute(
          "d",
          `M ${flatTipX} ${ELEVATION_PIVOT.y} A ${ELEVATION_LENGTH} ${ELEVATION_LENGTH} 0 0 0 ${maxTipX} ${maxTipY}`
        )
        elevationMax.setAttribute("x2", String(maxTipX))
        elevationMax.setAttribute("y2", String(maxTipY))
      }

      function renderElevation() {
        elevationLine.setAttribute(
          "x2",
          String(ELEVATION_PIVOT.x + Math.cos(elevation) * ELEVATION_LENGTH)
        )
        elevationLine.setAttribute(
          "y2",
          String(ELEVATION_PIVOT.y - Math.sin(elevation) * ELEVATION_LENGTH)
        )
        // elevation is held in radians, the unit cueStrike takes; the widget
        // shows degrees to a tenth.
        const degrees = (elevation * 180) / Math.PI
        elevationWidget.setAttribute(
          "aria-valuenow",
          String(Math.round(degrees))
        )
        elevationReadout.textContent = `${degrees.toFixed(1)}°`
        syncDiagram()
      }

      function setElevation(radians) {
        elevation = clamp(radians, 0, MAX_ELEVATION)
        renderElevation()
      }

      let draggingElevation = false

      // Widget space is the viewBox, read rather than assumed so it stays in
      // step with the markup. The pivot is the bottom-left of the area, so the
      // bearing to the pointer is the angle the cue is raised to.
      function elevationFromPointer(event) {
        const rect = elevationWidget.getBoundingClientRect()
        const view = elevationWidget.viewBox.baseVal
        if (rect.width === 0 || rect.height === 0 || view.width === 0) return
        const userX =
          view.x + ((event.clientX - rect.left) / rect.width) * view.width
        const userY =
          view.y + ((event.clientY - rect.top) / rect.height) * view.height
        setElevation(
          Math.atan2(ELEVATION_PIVOT.y - userY, userX - ELEVATION_PIVOT.x)
        )
      }

      elevationWidget.addEventListener("pointerdown", (event) => {
        draggingElevation = true
        elevationWidget.setPointerCapture(event.pointerId)
        elevationFromPointer(event)
        event.preventDefault()
      })

      elevationWidget.addEventListener("pointermove", (event) => {
        if (!draggingElevation) return
        elevationFromPointer(event)
        event.preventDefault()
      })

      function endElevation(event) {
        if (!draggingElevation) return
        draggingElevation = false
        if (elevationWidget.hasPointerCapture(event.pointerId)) {
          elevationWidget.releasePointerCapture(event.pointerId)
        }
      }

      elevationWidget.addEventListener("pointerup", endElevation)
      elevationWidget.addEventListener("pointercancel", endElevation)

      // Double-click lays the cue back on the cloth, as double-clicking the
      // spin widget centres it.
      elevationWidget.addEventListener("dblclick", () => setElevation(0))

      // Balls may touch, with centres exactly MIN_GAP apart, but never overlap.
      function collides(index, x, y) {
        return balls.some((ball, other) => {
          if (other === index) return false
          return Math.hypot(ball.x - x, ball.y - y) < MIN_GAP
        })
      }

      // Walk the whole path from the ball's current spot to the pointer target
      // and stop at the first contact, so neither a fast drag nor a jump can
      // overlap a ball or pass straight through it.
      function placeBall(index, x, y) {
        const { x: fromX, y: fromY } = balls[index]
        const span = Math.hypot(x - fromX, y - fromY)
        if (span === 0) return

        const blockAt = (t) =>
          collides(index, fromX + (x - fromX) * t, fromY + (y - fromY) * t)

        const steps = Math.max(1, Math.ceil(span / (MIN_GAP / 4)))
        let free = 0
        let blocked = 1
        for (let i = 1; i <= steps; i += 1) {
          const t = i / steps
          if (blockAt(t)) {
            blocked = t
            break
          }
          free = t
        }

        // Close in on the exact contact point along the path.
        for (let i = 0; i < 12 && blocked - free > 1e-6; i += 1) {
          const t = (free + blocked) / 2
          if (blockAt(t)) {
            blocked = t
          } else {
            free = t
          }
        }

        balls[index].x = fromX + (x - fromX) * free
        balls[index].y = fromY + (y - fromY) * free
      }

      let dragIndex = null
      let grabOffset = { x: 0, y: 0 }
      let pan = null

      // Fingers on the table. pinch is the previous frame's spread and
      // midpoint, the baseline every move is measured against.
      const pointers = new Map()
      let pinch = null

      function beginPointer(event) {
        svg.classList.add("dragging")
        svg.setPointerCapture(event.pointerId)
        event.preventDefault()
      }

      // Spread and midpoint of the two oldest pointers, or null below two.
      function pinchState() {
        const [a, b] = [...pointers.values()]
        if (!a || !b) return null
        return {
          distance: Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY),
          mid: {
            clientX: (a.clientX + b.clientX) / 2,
            clientY: (a.clientY + b.clientY) / 2,
          },
        }
      }

      // One pinch is a slide then a zoom: the world point under the current
      // midpoint is the one the zoom then holds fixed, so the fingers never
      // slide off the cloth. Reusing zoomAt keeps the wheel, the pinch and the
      // zoom readout on exactly the same maths.
      function zoomPan(prev, next) {
        if (prev.distance === 0 || next.distance === 0) return
        const matrix = svg.getScreenCTM()
        if (!matrix) return
        view.x -= (next.mid.clientX - prev.mid.clientX) / Math.abs(matrix.a)
        view.y -= (next.mid.clientY - prev.mid.clientY) / Math.abs(matrix.d)
        applyView()
        zoomAt(toSvgCoords(svg, next.mid), next.distance / prev.distance)
      }

      svg.addEventListener("pointerdown", (event) => {
        pointers.set(event.pointerId, {
          clientX: event.clientX,
          clientY: event.clientY,
        })

        if (pointers.size >= 2) {
          // A second finger takes over. Dropping the drag modes also means the
          // finger left over cannot resume a ball or a pan when it lifts.
          draggingAim = false
          dragIndex = null
          pan = null
          // Seed the baseline only on entry, so a third finger cannot jump it.
          if (!pinch) pinch = pinchState()
          beginPointer(event)
          return
        }

        const point = toModelPoint(event)
        const radius = hitRadius()
        const nearest = findBall(point)
        const toAim = Math.hypot(point.x - aimTip.x, point.y - aimTip.y)

        // Whichever target the pointer is closest to wins, so a ball resting
        // near the aim dot is still reachable.
        if (
          toAim <= radius &&
          (nearest === null || toAim <= nearest.distance)
        ) {
          draggingAim = true
          aimGrab = { x: aimTip.x - point.x, y: aimTip.y - point.y }
          beginPointer(event)
          return
        }

        if (nearest === null) {
          const matrix = svg.getScreenCTM()
          if (!matrix) return
          pan = {
            clientX: event.clientX,
            clientY: event.clientY,
            scaleX: Math.abs(matrix.a),
            scaleY: Math.abs(matrix.d),
            viewX: view.x,
            viewY: view.y,
          }
          beginPointer(event)
          return
        }

        dragIndex = nearest.index
        grabOffset = {
          x: balls[nearest.index].x - point.x,
          y: balls[nearest.index].y - point.y,
        }
        beginPointer(event)
      })

      svg.addEventListener("pointermove", (event) => {
        if (!pointers.has(event.pointerId)) return
        pointers.set(event.pointerId, {
          clientX: event.clientX,
          clientY: event.clientY,
        })

        if (pointers.size >= 2) {
          event.preventDefault()
          const next = pinchState()
          if (pinch) zoomPan(pinch, next)
          pinch = next
          return
        }

        if (!draggingAim && dragIndex === null && pan === null) return
        event.preventDefault()

        if (draggingAim) {
          const point = toModelPoint(event)
          setAim({ x: point.x + aimGrab.x, y: point.y + aimGrab.y })
          return
        }

        if (pan) {
          view.x = pan.viewX - (event.clientX - pan.clientX) / pan.scaleX
          view.y = pan.viewY - (event.clientY - pan.clientY) / pan.scaleY
          applyView()
          return
        }

        const point = toModelPoint(event)
        placeBall(
          dragIndex,
          clamp(point.x + grabOffset.x, -BOUND_X, BOUND_X),
          clamp(point.y + grabOffset.y, -BOUND_Y, BOUND_Y)
        )
        if (dragIndex === CUE_BALL) renderAim()
        const ball = balls[dragIndex]
        circles[dragIndex].setAttribute("cx", String(ball.x))
        circles[dragIndex].setAttribute("cy", String(-ball.y))
        syncDiagram()
      })

      function endDrag(event) {
        pointers.delete(event.pointerId)
        if (svg.hasPointerCapture(event.pointerId)) {
          svg.releasePointerCapture(event.pointerId)
        }
        if (pointers.size < 2) pinch = null
        if (pointers.size === 0) {
          draggingAim = false
          dragIndex = null
          pan = null
          svg.classList.remove("dragging")
        }
      }

      svg.addEventListener("pointerup", endDrag)
      svg.addEventListener("pointercancel", endDrag)

      svg.addEventListener("dblclick", (event) => {
        if (findBall(toModelPoint(event)) === null) resetView()
      })

      // --- the 3D replay: the diagram bundle reads a state string, not the
      // widgets ---

      // diagram.js takes over #replay once its assets are in: it relabels the
      // button and re-reads the .topview's data-state whenever it is pressed.
      // So the editor's part is to keep that string current and to press the
      // button; this is the one place the shot crosses into the replay.
      const topview = document.querySelector(".topview")
      const replayButton = document.getElementById("replay")

      // The click is ignored while a shot is still running, so it waits for the
      // input to go quiet and the last state of a drag is the one that plays.
      const REPLAY_DELAY = 250
      let replayTimer = null

      function scheduleReplay() {
        clearTimeout(replayTimer)
        replayTimer = setTimeout(() => replayButton?.click(), REPLAY_DELAY)
      }

      function syncDiagram() {
        if (!topview) return
        const next = serializeState({
          ruleType: state.ruleType,
          cushionModel: state.cushionModel,
          practice: state.practice,
          balls,
          shot: {
            angle: aimAngle,
            power,
            offset: { x: spin.x, y: spin.y },
            elevation,
            i: CUE_BALL,
          },
        })
        topview.dataset.state = next
        topview.setAttribute("data-state", next)
        scheduleReplay()
      }

      // Which cushion the shot is played on. The model rides in the state, so
      // it reaches the replay, a share link and the launch links at once; the
      // constants behind it stay with the sliders below.
      const modelRadios = [...document.querySelectorAll(".model-toggle input")]

      function setCushionModel(model) {
        state.cushionModel = model
        const url = new URL(window.location.href)
        if (model === DEFAULT_CUSHION_MODEL) {
          url.searchParams.delete("cushionModel")
        } else {
          url.searchParams.set("cushionModel", model)
        }
        window.history.replaceState(null, "", url)
        syncDiagram()
      }

      modelRadios.forEach((radio) =>
        radio.addEventListener("change", () => {
          if (radio.checked) setCushionModel(radio.value)
        })
      )

      // A launch parameter or a share link may name a model, so the toggle
      // opens on the one the state actually holds.
      modelRadios.forEach((radio) => {
        radio.checked = radio.value === state.cushionModel
      })

      // The constant sliders belong to the bundle: Sliders owns each value, the
      // physics setter it drives and the readout, all keyed on the input's id.
      // So the editor only has to notice the change. It writes the values back
      // to the URL, which is where Sliders seeds from and so what a shared link
      // carries -- and which readConstants() will put on the launch links.
      const constantInputs = [
        ...document.querySelectorAll("#constants input[type=range]"),
      ]

      function syncConstants() {
        const url = new URL(window.location.href)
        constantInputs.forEach((input) =>
          url.searchParams.set(input.id, input.value)
        )
        window.history.replaceState(null, "", url)
      }

      constantInputs.forEach((input) =>
        input.addEventListener("input", () => {
          syncConstants()
          // A replay already drawn its shot against the old constants, and the
          // bundle's own Sliders has no re-run of its own, so ask for one here.
          scheduleReplay()
        })
      )

      // --- action: the floating panel's button and the dialog it opens ---
      // The dialog is hidden in the markup, so it is only ever in the document
      // when the button has been pressed. Escape and a click on the backdrop
      // both close it; the button stays the only opener.
      const actionButton = document.getElementById("action")
      const actionModal = document.getElementById("action-modal")

      function setActionModal(open) {
        if (!actionModal) return
        actionModal.hidden = !open
        actionButton?.setAttribute("aria-expanded", String(open))
      }

      actionButton?.addEventListener("click", () => setActionModal(true))
      actionModal?.addEventListener("click", (event) => {
        if (event.target === actionModal) setActionModal(false)
      })
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") setActionModal(false)
      })

      renderAim()
      renderSpin()
      renderPower()
      renderElevationGuides()
      renderElevation()
      applyView()
    </script>
  </body>
</html>
