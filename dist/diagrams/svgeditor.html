<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Three cushion ball editor</title>
    <meta
      name="description"
      content="Move the three cushion balls with the pointer and read their exact table coordinates in metres."
    />
    <link rel="stylesheet" href="../css/ball-colors.css" />
    <style>
      body {
        margin: 0;
        padding: 0 1rem 1rem;
        background: #f0f0f0;
        color: #111;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      header {
        max-width: 72rem;
        margin: 0 auto;
        padding: 0.5rem 0;
      }

      h1 {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 600;
      }

      main {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: flex-start;
        max-width: 72rem;
        margin: 0 auto;
      }

      .table-panel {
        flex: 1 1 22rem;
        min-width: 0;
      }

      svg.billiards-table {
        display: block;
        width: 100%;
        height: auto;
        background: #fff;
        border-radius: 0.25rem;
        touch-action: none;
        user-select: none;
      }

      /* Carom ball colours; ball-colors.css is keyed to pool/snooker ids. */

      svg.billiards-table .ball-0 {
        --ball-fill: #fff;
        --ball-stroke: #333;
      }

      svg.billiards-table .ball-1 {
        --ball-fill: #ffd700;
        --ball-stroke: #a67c00;
      }

      svg.billiards-table .ball-2 {
        --ball-fill: #e63946;
        --ball-stroke: #8d1b25;
      }

      svg.billiards-table .ball {
        cursor: grab;
      }

      svg.billiards-table.dragging {
        cursor: grabbing;
      }

      svg.billiards-table.zoomed {
        cursor: grab;
      }

      svg.billiards-table .aim-line {
        stroke: #c2410c;
        stroke-width: 0.0025;
        stroke-linecap: round;
        stroke-opacity: 0.75;
      }

      svg.billiards-table .aim-head {
        fill: none;
        stroke: #c2410c;
        stroke-width: 0.002;
      }

      .coords-panel {
        flex: 0 1 18rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
      }

      caption {
        padding-bottom: 0.25rem;
        color: #555;
        font-size: 0.8rem;
        text-align: left;
      }

      th,
      td {
        padding: 0.1rem 0.5rem 0.1rem 0;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }

      .init,
      .aim {
        margin: 0.5rem 0 0;
        color: #555;
        font-size: 0.75rem;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }

      .view {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0.5rem 0 0;
        color: #555;
        font-size: 0.75rem;
      }

      .spin {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        margin: 0.5rem 0 0;
      }

      /* The ball as the cue sees it: one user unit is one ball radius, so an
         offset reads at its true size. */
      .spin-widget {
        flex: none;

        /* 1.05x the ball's 6rem, so padding the viewBox above did not shrink
           the ball itself. */
        width: 6.3rem;
        height: 6.3rem;
        cursor: crosshair;
        touch-action: none;
      }

      .spin-widget .spin-ball {
        fill: #fff;
        stroke: #333;
        stroke-width: 0.02;
      }

      .spin-widget .spin-limit {
        fill: none;
        stroke: #b91c1c;
        stroke-width: 0.016;
        stroke-dasharray: 0.06 0.05;
        stroke-opacity: 0.5;
      }

      /* Pinned to the miscue limit: the strike is no longer reproducible. */
      .spin-widget.at-limit .spin-limit {
        stroke-opacity: 1;
      }

      .spin-widget .spin-axis {
        stroke: #bbb;
        stroke-width: 0.016;
      }

      .spin-widget .spin-dot {
        fill: #c2410c;
        fill-opacity: 0.85;
        stroke: #7c2d12;
        stroke-width: 0.016;
      }

      .spin-readout {
        margin: 0;
        color: #555;
        font-size: 0.75rem;
      }

      button {
        padding: 0.15rem 0.5rem;
        border: 1px solid #bbb;
        border-radius: 0.25rem;
        background: #fff;
        color: #111;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Three cushion ball editor</h1>
    </header>

    <main>
      <div class="table-panel">
        <svg class="billiards-table threecushion"></svg>
      </div>
      <section class="coords-panel" aria-label="Ball positions">
        <table>
          <caption>
            Ball positions in metres
          </caption>
          <thead>
            <tr>
              <th scope="col">Ball</th>
              <th scope="col">x</th>
              <th scope="col">y</th>
            </tr>
          </thead>
          <tbody id="coord-body"></tbody>
        </table>
        <p class="init">init <code id="init-state"></code></p>
        <p class="aim">cue ball 0 · aim <span id="aim-angle"></span></p>
        <div class="spin">
          <!-- ViewBox is padded past the ball so the ball's outline, which is
               stroked across r=1, is not clipped by the viewport edge. -->
          <svg
            class="spin-widget"
            viewBox="-1.05 -1.05 2.1 2.1"
            role="img"
            aria-label="Cue tip contact point on the cue ball"
          >
            <circle class="spin-ball" r="1" />
            <circle class="spin-limit" r="0.45" />
            <line class="spin-axis" x1="-0.5" y1="0" x2="0.5" y2="0" />
            <line class="spin-axis" x1="0" y1="-0.5" x2="0" y2="0.5" />
            <circle class="spin-dot" r="0.15" />
          </svg>
          <p class="spin-readout">
            spin <code id="spin-offset"></code>
            <button id="reset-spin" type="button">reset spin</button>
          </p>
        </div>
        <p class="view">
          zoom <span id="zoom-level">×1.0</span>
          <button id="reset-view" type="button">reset view</button>
        </p>
      </section>
    </main>

    <script type="module">
      import {
        generateBilliardTable,
        renderBallPositions,
        setupSvgRoot,
        toSvgCoords,
        R,
        SVG_NS,
        X,
        Y,
      } from "./svg.js"

      // Table coordinates in metres with y pointing up, the same convention
      // three.html uses in its ?state=init. svg.js renders a ball at (x, -y).
      const balls = [
        { id: 0, x: -1.305026, y: -0.634005 },
        { id: 1, x: -1.434758, y: 0.601475 },
        { id: 2, x: -1.310215, y: 0.685593 },
      ]

      const BOUND_X = X - R
      const BOUND_Y = Y - R
      const MIN_GAP = 2 * R

      // Aim is a direction plus a drawn length, as in three.html. The length is
      // cosmetic: the tip is held at the cushion whatever the pointer distance.
      const CUE_BALL = 0
      const DEFAULT_AIM_LENGTH = 86 * R

      // Grabbing keeps ~16 screen px of slack around a ball when zoomed out and
      // narrows to the ball's own radius once the ball is large on screen.
      const HIT_PX = 16
      const MAX_ZOOM = 12
      const ZOOM_STEP = 0.0015

      const svg = document.querySelector(".billiards-table")
      const { tableGroup, trajectoriesGroup, ballsGroup, statusEl } =
        setupSvgRoot(svg)
      const table = generateBilliardTable()

      const baseView = parseViewBox(table.viewBox)
      let view = { ...baseView }

      svg.setAttribute("viewBox", table.viewBox)
      tableGroup.innerHTML = table.content
      statusEl.textContent =
        "drag a ball · drag the aim dot · drag the spin dot · scroll to zoom · drag cloth to pan"

      renderBallPositions(ballsGroup, {
        balls: balls.map(({ id, x, y }) => ({ id, pos: { x, y } })),
      })

      const circles = [...ballsGroup.querySelectorAll(".ball")]
      const coordBody = document.getElementById("coord-body")
      const initState = document.getElementById("init-state")
      const zoomLevel = document.getElementById("zoom-level")
      const aimAngleReadout = document.getElementById("aim-angle")

      const rows = balls.map((ball) => {
        const row = document.createElement("tr")
        const label = document.createElement("th")
        label.scope = "row"
        label.textContent = `ball ${ball.id}`
        const xCell = document.createElement("td")
        const yCell = document.createElement("td")
        row.append(label, xCell, yCell)
        coordBody.append(row)
        return { xCell, yCell }
      })

      function updateReadout() {
        balls.forEach(({ x, y }, index) => {
          rows[index].xCell.textContent = x.toFixed(6)
          rows[index].yCell.textContent = y.toFixed(6)
        })
        const init = balls.flatMap(({ x, y }) => [
          Number(x.toFixed(6)),
          Number(y.toFixed(6)),
        ])
        initState.textContent = JSON.stringify(init)
      }

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value))

      // --- view: wheel zoom about the pointer, cloth drag to pan ---

      function parseViewBox(value) {
        const [x, y, width, height] = value.split(/\s+/).map(Number)
        return { x, y, width, height }
      }

      function clampView() {
        view.x = clamp(
          view.x,
          baseView.x,
          baseView.x + baseView.width - view.width
        )
        view.y = clamp(
          view.y,
          baseView.y,
          baseView.y + baseView.height - view.height
        )
      }

      function applyView() {
        clampView()
        const zoom = baseView.width / view.width
        svg.setAttribute(
          "viewBox",
          `${view.x} ${view.y} ${view.width} ${view.height}`
        )
        svg.classList.toggle("zoomed", zoom > 1)
        zoomLevel.textContent = `×${zoom.toFixed(1)}`
      }

      function zoomAt(point, factor) {
        const zoom = baseView.width / view.width
        const next = clamp(zoom * factor, 1, MAX_ZOOM)
        const ratio = zoom / next
        view.width = baseView.width / next
        view.height = baseView.height / next
        view.x = point.x + (view.x - point.x) * ratio
        view.y = point.y + (view.y - point.y) * ratio
        applyView()
      }

      function resetView() {
        view = { ...baseView }
        applyView()
      }

      svg.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault()
          // deltaMode 1 counts lines instead of pixels (Firefox, some mice).
          const delta = event.deltaMode === 1 ? event.deltaY * 33 : event.deltaY
          zoomAt(toSvgCoords(svg, event), Math.exp(-delta * ZOOM_STEP))
        },
        { passive: false }
      )

      document
        .getElementById("reset-view")
        ?.addEventListener("click", resetView)

      // --- moving balls ---

      // toSvgCoords returns SVG user space (y down); the model keeps y up.
      function toModelPoint(event) {
        const { x, y } = toSvgCoords(svg, event)
        return { x, y: -y }
      }

      function hitRadius() {
        const matrix = svg.getScreenCTM()
        if (!matrix) return R
        return Math.max(R, HIT_PX / Math.abs(matrix.a))
      }

      function findBall(point) {
        const radius = hitRadius()
        let found = null
        balls.forEach((ball, index) => {
          const distance = Math.hypot(ball.x - point.x, ball.y - point.y)
          if (distance > radius) return
          if (found === null || distance < found.distance) {
            found = { index, distance }
          }
        })
        return found
      }

      // --- aim: the dot at the tip of the line sets the direction ---

      let aimAngle = 0.63687
      let aimLength = DEFAULT_AIM_LENGTH
      let aimTip = { x: 0, y: 0 }
      let draggingAim = false
      let aimGrab = { x: 0, y: 0 }

      const aimLine = document.createElementNS(SVG_NS, "line")
      aimLine.setAttribute("class", "aim-line")
      const aimHead = document.createElementNS(SVG_NS, "circle")
      aimHead.setAttribute("class", "aim-head")
      aimHead.setAttribute("r", String(R))
      // Drawn under the balls so the cue ball stays visible on top of the line.
      trajectoriesGroup.append(aimLine, aimHead)

      function normalizeAngle(angle) {
        const tau = Math.PI * 2
        return ((angle % tau) + tau) % tau
      }

      // Distance from (x, y) to the edge of a box along `angle`. Measuring
      // against the play area inset by R gives the point where the cue ball is
      // just touching a rail, so the aim dot marks real contact.
      function distanceToEdge(x, y, angle, halfWidth, halfHeight) {
        const dx = Math.cos(angle)
        const dy = Math.sin(angle)
        const distances = []
        if (dx > 0) distances.push((halfWidth - x) / dx)
        else if (dx < 0) distances.push((-halfWidth - x) / dx)
        if (dy > 0) distances.push((halfHeight - y) / dy)
        else if (dy < 0) distances.push((-halfHeight - y) / dy)
        const positive = distances.filter((distance) => distance >= 0)
        if (positive.length === 0) return 0
        return Math.min(...positive)
      }

      function renderAim() {
        const cue = balls[CUE_BALL]
        const limit = distanceToEdge(cue.x, cue.y, aimAngle, BOUND_X, BOUND_Y)
        const length = Math.min(aimLength, limit)
        aimTip = {
          x: cue.x + Math.cos(aimAngle) * length,
          y: cue.y + Math.sin(aimAngle) * length,
        }
        aimLine.setAttribute("x1", String(cue.x))
        aimLine.setAttribute("y1", String(-cue.y))
        aimLine.setAttribute("x2", String(aimTip.x))
        aimLine.setAttribute("y2", String(-aimTip.y))
        aimHead.setAttribute("cx", String(aimTip.x))
        aimHead.setAttribute("cy", String(-aimTip.y))
        const degrees = (normalizeAngle(aimAngle) * 180) / Math.PI
        aimAngleReadout.textContent = `${degrees.toFixed(1)}°`
      }

      // The pointer target is the aim point; the angle is measured from the cue
      // ball in model space, so it matches three.html's shot angle.
      function setAim(point) {
        const cue = balls[CUE_BALL]
        const dx = point.x - cue.x
        const dy = point.y - cue.y
        aimAngle = normalizeAngle(Math.atan2(dy, dx))
        aimLength = Math.hypot(dx, dy)
        renderAim()
      }

      // --- spin: where the cue tip contacts the cue ball ---

      // Offset is in units of R, the same as three.html's shots[].offset, and
      // lives in the cue's own frame: y is the vertical hit (follow or draw),
      // x the lateral one. It is therefore unaffected by the aim direction or
      // the cue ball's position. x is mirrored on screen, the same way
      // three.html places its cue tip and svg.js draws renderInset.
      const SPIN_LIMIT = 0.45
      const spin = { x: 0, y: 0 }
      const spinWidget = document.querySelector(".spin-widget")
      const spinDot = spinWidget.querySelector(".spin-dot")
      const spinOffset = document.getElementById("spin-offset")

      function clampSpin(x, y) {
        const length = Math.hypot(x, y)
        if (length <= SPIN_LIMIT || length === 0) return { x, y }
        const scale = SPIN_LIMIT / length
        return { x: x * scale, y: y * scale }
      }

      function signed(value) {
        return `${value < 0 ? "-" : "+"}${Math.abs(value).toFixed(3)}`
      }

      function renderSpin() {
        spinDot.setAttribute("cx", String(-spin.x))
        spinDot.setAttribute("cy", String(-spin.y))
        const atLimit = Math.hypot(spin.x, spin.y) >= SPIN_LIMIT - 1e-9
        spinWidget.classList.toggle("at-limit", atLimit)
        spinOffset.textContent = `x ${signed(spin.x)}R · y ${signed(spin.y)}R`
      }

      function setSpin(x, y) {
        const next = clampSpin(x, y)
        spin.x = next.x
        spin.y = next.y
        renderSpin()
      }

      let draggingSpin = false

      // Widget space is the viewBox, in units of R with y down, so both axes
      // are negated on the way to the model offset. Reading the viewBox rather
      // than assuming -1..1 keeps the mapping right despite its padding.
      function spinFromPointer(event) {
        const rect = spinWidget.getBoundingClientRect()
        const view = spinWidget.viewBox.baseVal
        if (rect.width === 0 || rect.height === 0 || view.width === 0) return
        const userX =
          view.x + ((event.clientX - rect.left) / rect.width) * view.width
        const userY =
          view.y + ((event.clientY - rect.top) / rect.height) * view.height
        setSpin(-userX, -userY)
      }

      spinWidget.addEventListener("pointerdown", (event) => {
        draggingSpin = true
        spinWidget.setPointerCapture(event.pointerId)
        spinFromPointer(event)
        event.preventDefault()
      })

      spinWidget.addEventListener("pointermove", (event) => {
        if (!draggingSpin) return
        spinFromPointer(event)
        event.preventDefault()
      })

      function endSpin(event) {
        if (!draggingSpin) return
        draggingSpin = false
        if (spinWidget.hasPointerCapture(event.pointerId)) {
          spinWidget.releasePointerCapture(event.pointerId)
        }
      }

      spinWidget.addEventListener("pointerup", endSpin)
      spinWidget.addEventListener("pointercancel", endSpin)

      function resetSpin() {
        setSpin(0, 0)
      }

      spinWidget.addEventListener("dblclick", resetSpin)
      document
        .getElementById("reset-spin")
        ?.addEventListener("click", resetSpin)

      // Balls may touch, with centres exactly MIN_GAP apart, but never overlap.
      function collides(index, x, y) {
        return balls.some((ball, other) => {
          if (other === index) return false
          return Math.hypot(ball.x - x, ball.y - y) < MIN_GAP
        })
      }

      // Walk the whole path from the ball's current spot to the pointer target
      // and stop at the first contact, so neither a fast drag nor a jump can
      // overlap a ball or pass straight through it.
      function placeBall(index, x, y) {
        const { x: fromX, y: fromY } = balls[index]
        const span = Math.hypot(x - fromX, y - fromY)
        if (span === 0) return

        const blockAt = (t) =>
          collides(index, fromX + (x - fromX) * t, fromY + (y - fromY) * t)

        const steps = Math.max(1, Math.ceil(span / (MIN_GAP / 4)))
        let free = 0
        let blocked = 1
        for (let i = 1; i <= steps; i += 1) {
          const t = i / steps
          if (blockAt(t)) {
            blocked = t
            break
          }
          free = t
        }

        // Close in on the exact contact point along the path.
        for (let i = 0; i < 12 && blocked - free > 1e-6; i += 1) {
          const t = (free + blocked) / 2
          if (blockAt(t)) {
            blocked = t
          } else {
            free = t
          }
        }

        balls[index].x = fromX + (x - fromX) * free
        balls[index].y = fromY + (y - fromY) * free
      }

      let dragIndex = null
      let grabOffset = { x: 0, y: 0 }
      let pan = null

      function beginPointer(event) {
        svg.classList.add("dragging")
        svg.setPointerCapture(event.pointerId)
        event.preventDefault()
      }

      svg.addEventListener("pointerdown", (event) => {
        const point = toModelPoint(event)
        const radius = hitRadius()
        const nearest = findBall(point)
        const toAim = Math.hypot(point.x - aimTip.x, point.y - aimTip.y)

        // Whichever target the pointer is closest to wins, so a ball resting
        // near the aim dot is still reachable.
        if (
          toAim <= radius &&
          (nearest === null || toAim <= nearest.distance)
        ) {
          draggingAim = true
          aimGrab = { x: aimTip.x - point.x, y: aimTip.y - point.y }
          beginPointer(event)
          return
        }

        if (nearest === null) {
          const matrix = svg.getScreenCTM()
          if (!matrix) return
          pan = {
            clientX: event.clientX,
            clientY: event.clientY,
            scaleX: Math.abs(matrix.a),
            scaleY: Math.abs(matrix.d),
            viewX: view.x,
            viewY: view.y,
          }
          beginPointer(event)
          return
        }

        dragIndex = nearest.index
        grabOffset = {
          x: balls[nearest.index].x - point.x,
          y: balls[nearest.index].y - point.y,
        }
        beginPointer(event)
      })

      svg.addEventListener("pointermove", (event) => {
        if (!draggingAim && dragIndex === null && pan === null) return
        event.preventDefault()

        if (draggingAim) {
          const point = toModelPoint(event)
          setAim({ x: point.x + aimGrab.x, y: point.y + aimGrab.y })
          return
        }

        if (pan) {
          view.x = pan.viewX - (event.clientX - pan.clientX) / pan.scaleX
          view.y = pan.viewY - (event.clientY - pan.clientY) / pan.scaleY
          applyView()
          return
        }

        const point = toModelPoint(event)
        placeBall(
          dragIndex,
          clamp(point.x + grabOffset.x, -BOUND_X, BOUND_X),
          clamp(point.y + grabOffset.y, -BOUND_Y, BOUND_Y)
        )
        if (dragIndex === CUE_BALL) renderAim()
        const ball = balls[dragIndex]
        circles[dragIndex].setAttribute("cx", String(ball.x))
        circles[dragIndex].setAttribute("cy", String(-ball.y))
        updateReadout()
      })

      function endDrag(event) {
        if (!draggingAim && dragIndex === null && pan === null) return
        draggingAim = false
        dragIndex = null
        pan = null
        svg.classList.remove("dragging")
        if (svg.hasPointerCapture(event.pointerId)) {
          svg.releasePointerCapture(event.pointerId)
        }
      }

      svg.addEventListener("pointerup", endDrag)
      svg.addEventListener("pointercancel", endDrag)

      svg.addEventListener("dblclick", (event) => {
        if (findBall(toModelPoint(event)) === null) resetView()
      })

      updateReadout()
      renderAim()
      renderSpin()
      applyView()
    </script>
  </body>
</html>
