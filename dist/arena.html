<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Billiards Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo:wght@200;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="../assets/threecushion.png" />
    <script>
      try {
        const params = new URLSearchParams(window.location.search)
        const theme =
          params.get("theme") || localStorage.getItem("theme") || "dark"
        document.documentElement.setAttribute("theme", theme)
        document.documentElement.style.colorScheme =
          document.documentElement.getAttribute("theme")
      } catch (_e) {
        document.documentElement.setAttribute("theme", "dark")
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f5f5f5;
        color: #212121;
      }

      html[theme="dark"],
      html[theme="dark"] body {
        background: #1a1a1a;
        color: #e0e0e0;
      }
    </style>
  </head>
  <body>
    <arena-app></arena-app>
    <script src="arena.js" type="module"></script>
  </body>
</html>
