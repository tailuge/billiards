<svg width="896" height="543" xmlns:xlink="http://www.w3.org/1999/xlink" class="billiards-table threecushion" data-figure="2.99 m/s" xmlns="http://www.w3.org/2000/svg" viewBox="-1.792395 -1.036198 3.584790 2.172395"><style>.ball {
  fill: var(--ball-fill, none);
  stroke: var(--ball-stroke, #000);
  stroke-width: 0.002;
  filter: drop-shadow(0 0.002px 0.004px rgb(0 0 0 / 90%));
}

.trajectory-line {
  fill: none;
  stroke: #000;
  stroke-width: 0.002;
  stroke-opacity: 0.5;
}

.traj-0 {
  stroke-opacity: 1;
}

.traj-1 {
  stroke-opacity: 0.75;
  stroke: #ffd900;
}

/* Default / Pool Colors */
.ball-0 {
  --ball-fill: #fff !important;
  --ball-stroke: #000;
}

.ball-1 {
  --ball-stroke: #ffd900;
}

.ball-2 {
  --ball-stroke: #00f;
}

.traj-2 {
  stroke: #00f;
}

