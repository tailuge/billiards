/* Sagu Overrides: 4-ball carom -- balls 2 &amp; 3 are red object balls */
.sagu .ball {
  --ball-stroke: #000;
}

.sagu .trajectory-line {
  stroke: #000;
}

.sagu .ball-1 {
  --ball-stroke: #ffd700;
}

.sagu .traj-1 {
  stroke: #ffd700;
}

.sagu .ball-2,
.sagu .ball-3 {
  --ball-stroke: #f00;
}

.sagu .traj-2,
.sagu .traj-3 {
  stroke: #f00;
}

/* Three-Cushion Overrides: remain as it was (no colour) */

/* We ensure any colored strokes are reset to black for threecushion */
.threecushion .ball {
  --ball-stroke: #000;
}

.threecushion .trajectory-line {
  stroke: #000;
}

/* SVG Diagram Shared Styles */
.table-stroke {
  fill: none;
  stroke: #000;
  stroke-width: 0.004;
}

.grid-line {
  stroke: #ccc;
  stroke-width: 0.002;
  stroke-dasharray: 0.008 0.008;
}

.manual-line {
  fill: none;
  stroke: #4f4f4f;
  stroke-width: 0.001;
  stroke-dasharray: 0.06 0.03;
}

.fine-stroke {
  fill: none;
  stroke: #000;
  stroke-width: 0.001;
}

.worker-status {
  pointer-events: none;
  user-select: none;
}
