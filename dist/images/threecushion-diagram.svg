}

.traj-15 {
  stroke: #600;
}

/* Snooker Overrides */
.snooker .ball-1 {
  --ball-stroke: #ffd700;
}

.snooker .traj-1 {
  stroke: #ffd700;
}

.snooker .ball-2 {
  --ball-stroke: #008000;
}

.snooker .traj-2 {
  stroke: #008000;
}

.snooker .ball-3 {
  --ball-stroke: #6a2500;
}

.snooker .traj-3 {
