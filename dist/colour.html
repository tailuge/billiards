<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Colour Picker</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #141a22;
      }
      #view {
        position: fixed;
        inset: 0;
      }
      #hint {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 6px 10px;
        background: rgba(18, 22, 29, 0.86);
        border: 1px solid #2a323e;
        border-radius: 8px;
        color: #e6edf3;
        font: 13px sans-serif;
        user-select: none;
      }
      #picker {
        position: fixed;
        top: -100px;
        left: -100px;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="hint">Click a part of the table or room to recolour it</div>
    <input id="picker" type="color" />
    <script type="module">
      import * as THREE from "three"
      import { OrbitControls } from "three/addons/controls/OrbitControls.js"
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js"
      import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js"

      const view = document.getElementById("view")
      const hint = document.getElementById("hint")
      const picker = document.getElementById("picker")

      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0x141a22)
      scene.up = new THREE.Vector3(0, 0, 1)

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.01,
        100
      )
      camera.up.set(0, 0, 1)
      camera.position.set(2.5, -2.5, 2)

      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
      renderer.toneMapping = THREE.NoToneMapping
      view.appendChild(renderer.domElement)

      const controls = new OrbitControls(camera, renderer.domElement)
      controls.enableDamping = true
      controls.dampingFactor = 0.05
      controls.target.set(0, 0, 0)

      // Same single dim ambient light as the game (src/view/view.ts); all
      // other lighting comes from the lights embedded in the gltf.
      scene.add(new THREE.AmbientLight(0x009922, 0.3))

      function applyColour(name, hex) {
        for (const mat of matchingMaterials({ name })) {
          mat.color.set(hex)
          mat.needsUpdate = true
        }
      }

      // Colours are stored in the query string (one param per material name,
      // lowercase) so the URL can be shared. replaceState keeps the address
      // bar in sync without polluting history.
      function encodeColours() {
        const params = new URLSearchParams(window.location.search)
        const seen = new Set()
        scene.traverse((child) => {
          if (!child.isMesh) return
          for (const mat of materialsOf(child)) {
            if (mat && !seen.has(mat.name)) {
              seen.add(mat.name)
              params.set(mat.name.toLowerCase(), mat.color.getHexString())
            }
          }
        })
        window.history.replaceState(null, "", "?" + params.toString())
      }

      function decodeColours() {
        const params = new URLSearchParams(window.location.search)
        for (const [name, hex] of params) {
          if (/^[0-9a-f]{6}$/i.test(hex)) applyColour(name, "#" + hex)
        }
      }

      const R = 0.03275
      // Added before the table loads so saved URL colours reach the room too.
      scene.add(buildRoom())
      new GLTFLoader().load("models/p8.gltf", (gltf) => {
        gltf.scene.scale.set(R / 0.5, R / 0.5, R / 0.5)
        gltf.scene.matrixAutoUpdate = false
        gltf.scene.updateMatrix()
        gltf.scene.updateMatrixWorld()
        scene.add(gltf.scene)
        decodeColours()
      })

      // Simple JS port of src/view/room.ts: a low-poly room around the table
      // with a checkerboard tiled floor (hole left under the table) and one
      // pastel colour per wall, sized from the table footprint like the game's
      // Room (TableGeometry.X = R * 44, Y = R * 22, 2m clearance). The room
      // uses the same Lambert materials as the game, with no image textures.
      function buildRoom() {
        const clearance = 2
        const floorZ = -0.75
        const wallHeight = 4
        const floorColors = [0xe6e2d8, 0xd4cfc3]
        const wallColors = [0xf2c9c9, 0xc9d6f2, 0xcdeccd, 0xf2e8c9]

        const X = R * 44
        const Y = R * 22
        const tile = X / 3
        const cols = Math.round((X + clearance) / tile)
        const rows = Math.round((Y + clearance) / tile - 0.5)
        const xWall = cols * tile
        const yWall = (rows + 0.5) * tile

        const room = new THREE.Group()

        // Merge tiles into one geometry per checker colour so a click
        // recolours every tile of that colour.
        const tiles = [[], []]
        for (let i = -cols; i < cols; i++) {
          const x = (i + 0.5) * tile
          for (let j = -rows; j <= rows; j++) {
            const y = j * tile
            if (Math.abs(x) < X && Math.abs(y) < Y) {
              continue // hole under the table
            }
            const tileGeometry = new THREE.PlaneGeometry(tile, tile)
            tileGeometry.translate(x, y, floorZ)
            tiles[Math.abs(i + j) % 2].push(tileGeometry)
          }
        }
        tiles.forEach((set, parity) => {
          room.add(
            new THREE.Mesh(
              mergeGeometries(set),
              namedMaterial(
                parity === 0 ? "floorlight" : "floordark",
                floorColors[parity]
              )
            )
          )
        })

        // Single-sided wall planes whose front faces point inward.
        const walls = [
          {
            x: -xWall,
            y: 0,
            w: wallHeight,
            h: 2 * yWall,
            rx: 0,
            ry: Math.PI / 2,
            color: wallColors[0],
          },
          {
            x: xWall,
            y: 0,
            w: wallHeight,
            h: 2 * yWall,
            rx: 0,
            ry: -Math.PI / 2,
            color: wallColors[1],
          },
          {
            x: 0,
            y: -yWall,
            w: 2 * xWall,
            h: wallHeight,
            rx: -Math.PI / 2,
            ry: 0,
            color: wallColors[2],
          },
          {
            x: 0,
            y: yWall,
            w: 2 * xWall,
            h: wallHeight,
            rx: Math.PI / 2,
            ry: 0,
            color: wallColors[3],
          },
        ]
        walls.forEach((wall, i) => {
          const mesh = new THREE.Mesh(
            new THREE.PlaneGeometry(wall.w, wall.h),
            namedMaterial("wall" + i, wall.color)
          )
          mesh.rotation.set(wall.rx, wall.ry, 0)
          mesh.position.set(wall.x, wall.y, floorZ + wallHeight / 2)
          room.add(mesh)
        })

        return room
      }

      function namedMaterial(name, hex) {
        const material = new THREE.MeshLambertMaterial({ color: hex })
        material.name = name
        return material
      }

      function materialsOf(mesh) {
        return Array.isArray(mesh.material) ? mesh.material : [mesh.material]
      }

      // All materials in the scene sharing the clicked material's name
      // (case-insensitive, since URL params are lowercased).
      function matchingMaterials(source) {
        const name = source.name.toLowerCase()
        const found = new Set()
        scene.traverse((child) => {
          if (child.isMesh) {
            for (const mat of materialsOf(child)) {
              if (mat && mat.name.toLowerCase() === name) found.add(mat)
            }
          }
        })
        return [...found]
      }

      function toHex(color) {
        return "#" + color.getHexString()
      }

      const raycaster = new THREE.Raycaster()
      const pointer = new THREE.Vector2()

      // Distinguish a click from an orbit drag.
      let downX = 0
      let downY = 0
      renderer.domElement.addEventListener("pointerdown", (e) => {
        downX = e.clientX
        downY = e.clientY
      })
      renderer.domElement.addEventListener("pointerup", (e) => {
        if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5) return

        pointer.set(
          (e.clientX / window.innerWidth) * 2 - 1,
          -(e.clientY / window.innerHeight) * 2 + 1
        )
        raycaster.setFromCamera(pointer, camera)
        const hits = raycaster.intersectObjects(scene.children, true)
        const hit = hits.find((h) => {
          const mats = materialsOf(h.object)
          return mats.length > 0
        })
        if (!hit) return

        const mat = materialsOf(hit.object)[0]
        hint.textContent = "Selected: " + mat.name
        picker.value = toHex(mat.color)
        picker.dataset.name = mat.name.toLowerCase()
        picker.click()
      })

      picker.addEventListener("input", () => {
        const name = picker.dataset.name
        applyColour(name, picker.value)
        encodeColours()
      })

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight
        camera.updateProjectionMatrix()
        renderer.setSize(window.innerWidth, window.innerHeight)
      })

      function animate() {
        requestAnimationFrame(animate)
        controls.update()
        renderer.render(scene, camera)
      }
      animate()
    </script>
  </body>
</html>
