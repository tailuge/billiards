<html lang="en">

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin
    ></script>

    <style>
      @font-face {
        font-family: Exo;
        font-style: normal;
        font-weight: 200;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/exo/v25/4UaZrEtFpBI4f1ZSIK9d4LjJ4tM3CwM.ttf")
          format("truetype");
      }

      @font-face {
        font-family: Exo;
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/exo/v25/4UaZrEtFpBI4f1ZSIK9d4LjJ4o0wCwM.ttf")
          format("truetype");
      }

      /* Palette, radii and spacing follow the lobby's dark theme: a #1a1a1a
         page, #2a2a2a surfaces outlined with a 1px #444 border, a subtle 6px
         radius and 2px gutters between the rounded panels. */
      :root {
        --bg: #1a1a1a;
        --surface: #2a2a2a;
        --border: #444;
        --border-light: #333;
        --hover: #444;
        --text: #e0e0e0;
        --muted: #aaa;
        --accent: #6ba3f5;

        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;

        /* Gutter between the panel and the viewport, matching the lobby's
           inset content column. */
        padding: 0 1rem 1rem;
        background: var(--bg);
        color: var(--text);
        font-family: Exo, system-ui, sans-serif;
        font-weight: 200;
        font-size: 15px;
      }

      header {
        flex: 0 0 auto;
        padding: 0.4rem 0.2rem;
      }

      h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
      }

      header p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      /* Title and panel share one centred, width-capped column so the layout
         reads like the lobby page rather than edge-to-edge. */
      header,
      main {
        width: 100%;
        max-width: min(80rem, 100%);
        margin-inline: auto;
      }

      main {
        flex: 1 1 auto;
        display: flex;
        gap: 2px;
        min-height: 0;
        padding: 2px;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      #list {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        gap: 2px;
        width: 16rem;
        margin: 0;
        padding: 2px;
        overflow-y: auto;
        list-style: none;
        background: var(--surface);
      }

      #list li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem;
        padding: 6px 10px;
        border: 1px solid var(--border-light);
        border-radius: 4px;
        color: var(--muted);
        font-size: 0.82rem;
        cursor: pointer;
      }

      #list li:hover {
        background: var(--hover);
        color: var(--text);
      }

      #list li.active {
        background: var(--hover);
        box-shadow: inset 3px 0 0 var(--accent);
        color: var(--text);
      }

      #list li .hall {
        flex: 1 1 auto;
        min-width: 0;
      }

      #list li b {
        display: block;
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 600;
      }

      /* Japanese name and ward on one muted metadata line. */
      #list li .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        color: var(--muted);
      }

      /* Progress star: hollow by default, filled once the hall is marked
         visited. Nothing sets .is-visited yet, so every hall starts empty. */
      #list li .star {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1;
      }

      #list li .star::before {
        content: "☆";
      }

      #list li.is-visited .star::before {
        content: "★";
        color: var(--accent);
      }

      /* Selected halls unfold to reveal the rest of the entry. Basis 100%
         wraps the block onto its own line under the name and star. */
      #list li .details {
        display: none;
        flex: 1 0 100%;
        grid-template-columns: auto 1fr;
        gap: 2px 0.5rem;
        margin: 0;
        padding-top: 4px;
        border-top: 1px solid var(--border-light);
        font-size: 0.75rem;
        line-height: 1.35;
      }

      #list li.active .details {
        display: grid;
      }

      #list li .details dt {
        color: var(--muted);
      }

      #list li .details dd {
        margin: 0;
        color: var(--text);
      }

      /* Website link in the expanded entry. URLs are long, so let them break
         anywhere rather than overflow the narrow panel. */
      #list li .details .site {
        color: var(--accent);
        overflow-wrap: anywhere;
      }

      #list li .details .site:hover {
        text-decoration: underline;
      }

      #map {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        border-radius: 4px;
      }

      .leaflet-container {
        background: var(--bg);
        font-family: inherit;
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: var(--hover);
        color: var(--text);
        box-shadow: none;
      }

      .leaflet-popup-content-wrapper {
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .leaflet-popup-content {
        margin: 8px 12px;
        font-size: 0.82rem;
      }

      /* Permanent name labels beside the markers. Leaflet's tooltip defaults to
         a white chip; recolour it to sit on the dark tiles. */
      .leaflet-tooltip.hall-label,
      .leaflet-tooltip.station-label {
        padding: 1px 5px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        box-shadow: none;
        font-size: 0.75rem;
      }

      /* direction:auto flips labels left or right, so recolour both arrows. */
      .leaflet-tooltip-left.hall-label::before,
      .leaflet-tooltip-left.station-label::before {
        border-left-color: var(--bg);
      }

      .leaflet-tooltip-right.hall-label::before,
      .leaflet-tooltip-right.station-label::before {
        border-right-color: var(--bg);
      }

      /* The halls are what the page is about, so their labels carry the same
         accent blue as the hall dots. On the label background that is 6.78:1,
         comfortably above the 4.5:1 WCAG AA threshold for body text. */
      .leaflet-tooltip.hall-label {
        color: var(--accent);
      }

      /* The line's stations are context rather than the point of the page, so
         they stay muted against the blue hall labels. */
      .leaflet-tooltip.station-label {
        font-size: 0.7rem;
        color: var(--muted);
      }

      /* Hall markers are HTML divIcons rather than L.circleMarker: Leaflet
         scales a vector renderer's container during the zoom animation, so a
         circle marker balloons on the way to max zoom and snaps back at the
         end. A marker icon is only repositioned, so the dot keeps its size the
         whole way. The box is the selected size, so the anchor stays centred
         while the visible dot grows from 16px (r=7 + 2px stroke) to 21px
         (r=9 + 3px stroke). */
      .hall-dot {
        display: grid;
        place-items: center;
      }

      .hall-dot::before {
        content: "";
        box-sizing: border-box;
        width: 16px;
        height: 16px;
        border: 2px solid var(--accent);
        border-radius: 50%;
        background: rgb(107 163 245 / 70%);
      }

      .hall-dot.is-chosen::before {
        width: 21px;
        height: 21px;
        border-width: 3px;
        border-color: #fff;
        background: var(--accent);
      }

      /* Station dots reuse the constant-size divIcon trick the hall dots use,
         drawn in the line's yellow-green. */
      .station-dot {
        border: 1px solid var(--bg);
        border-radius: 50%;
        background: #9acd32;
      }

      /* Leaflet's chrome defaults to light; darken it to sit on the dark tiles. */
      .leaflet-control-attribution {
        background: rgb(26 26 26 / 80%);
        color: var(--muted);
      }

      .leaflet-control-attribution a {
        color: var(--accent);
      }

      .leaflet-bar a {
        background: var(--surface);
        border-bottom-color: var(--border);
        color: var(--text);
      }

      .leaflet-bar a:hover {
        background: var(--hover);
      }

      @media (width <= 700px) {
        body {
          padding: 0 0.5rem 0.5rem;
        }

        main {
          flex-direction: column;
        }

        #list {
          width: 100%;
          max-height: 40%;
        }
      }
    </style>
  </head>

        ["Tabata", "田端", 35.73738, 139.76172],
        ["Nishi-Nippori", "西日暮里", 35.73222, 139.7667],
        ["Nippori", "日暮里", 35.72799, 139.77043],
        ["Uguisudani", "鶯谷", 35.72171, 139.77793],
        ["Ueno", "上野", 35.71358, 139.77614],
        ["Okachimachi", "御徒町", 35.70695, 139.77465],
        ["Akihabara", "秋葉原", 35.69836, 139.77306],
        ["Kanda", "神田", 35.69177, 139.77101],
        ["Tokyo", "東京", 35.68124, 139.76661],
        ["Yurakucho", "有楽町", 35.67494, 139.76306],
        ["Shimbashi", "新橋", 35.66616, 139.75814],
        ["Hamamatsucho", "浜松町", 35.65511, 139.75708],
        ["Tamachi", "田町", 35.64572, 139.7477],
        ["Takanawa Gateway", "高輪ゲートウェイ", 35.63541, 139.74064],
      ]

      // Markers are HTML divIcons (see .hall-dot) so the dot keeps a constant
      // pixel size while the map zooms; a scaled vector circle would balloon.
      // The icon is the selected size, keeping the anchor centred as it grows.
      const dotIcon = L.divIcon({
        className: "hall-dot",
        iconSize: [21, 21],
        iconAnchor: [10.5, 10.5],
      })

      // CARTO's free API key serves raster tiles up to zoom 18; deeper tiles
      // return HTTP 403 ("Forbidden: raster tiles are available up to zoom 18").
      const maxTileZoom = 18

      const map = L.map("map", { maxZoom: maxTileZoom }).setView(
        [35.6895, 139.6917],
        12
      )

      // CARTO "Dark Matter" tiles, so the map matches the dark page. The
      // keyless dark_all URL only returns a watermark placeholder, hence the key.
      L.tileLayer(
        "https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png?key=cb1_4e2d_1_2f1763bbc5441acd7eb62607",
        {
          maxZoom: maxTileZoom,
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
        }
      ).addTo(map)

      // The line draws in Leaflet's overlay pane, below the marker pane the
      // dots live in, so the halls stay on top and keep their clicks.
      L.polyline(yamanoteLine, {
        color: "#9acd32",
        opacity: 0.6,
        weight: 3,
      }).addTo(map)

      // Station dots are divIcons for the same reason as the hall dots: Leaflet
      // scales an SVG renderer during the zoom animation, so a circleMarker
      // would balloon on the way to max zoom. One icon serves all 30 markers.
      const stationDot = L.divIcon({
        className: "station-dot",
        iconSize: [9, 9],
        iconAnchor: [4.5, 4.5],
      })

      yamanoteStations.forEach(function (station) {
        L.marker([station[2], station[3]], { icon: stationDot })
          .addTo(map)
          .bindTooltip(station[0] + " " + station[1], {
            permanent: true,
            direction: "right",
            offset: [6, 0],
            className: "station-label",
          })
      })

      const list = document.getElementById("list")
      const markers = {}

      function select(id, pan) {
        list.querySelectorAll("li").forEach(function (item) {
          item.classList.toggle("active", item.dataset.id === id)
        })
        Object.keys(markers).forEach(function (mid) {
          markers[mid].getElement().classList.toggle("is-chosen", mid === id)
        })

        const item = list.querySelector('li[data-id="' + id + '"]')
        if (item) {
          item.scrollIntoView({ block: "nearest" })
        }

        if (pan) {
          const hall = halls.find(function (h) {
            return h.id === id
          })
          map.flyTo([hall.lat, hall.lng], maxTileZoom, { duration: 0.8 })
          markers[id].openPopup()
        }
      }

      halls.forEach(function (hall) {
        const item = document.createElement("li")
        item.dataset.id = hall.id
        item.innerHTML = `
          <span class="hall">
            <b>${hall.name}</b>
            <span class="meta">
              <span lang="ja">${hall.japaneseName}</span>
              <span>${hall.district}</span>
            </span>
          </span>
          <span class="star" aria-hidden="true"></span>
          <dl class="details">
            <dt>Address</dt>
            <dd>${hall.address}</dd>
            <dt>Website</dt>
            <dd>
              <a
                class="site"
                href="${hall.website}"
                target="_blank"
                rel="noopener"
                >${hall.website}</a
              >
            </dd>
          </dl>
        `
        item.addEventListener("click", function () {
          select(hall.id, true)
        })
        list.appendChild(item)

        const marker = L.marker([hall.lat, hall.lng], { icon: dotIcon })
          .addTo(map)
          .bindPopup(
            `<b>${hall.name}</b><br><span lang="ja">${hall.japaneseName}</span>`
          )
          .bindTooltip(`<span lang="ja">${hall.japaneseName}</span>`, {
            permanent: true,
            direction: "auto",
            offset: [10, 0],
            className: "hall-label",
          })
        marker.addEventListener("click", function () {
          select(hall.id, false)
        })
        markers[hall.id] = marker
      })
    </script>
  </body>
</html>
