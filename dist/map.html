<html lang="en">
  <head>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

      crossorigin
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

      crossorigin
    ></script>

    <style>
      @font-face {
        font-family: Exo;
        font-style: normal;
        font-weight: 200;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/exo/v25/4UaZrEtFpBI4f1ZSIK9d4LjJ4tM3CwM.ttf")
          format("truetype");
      }

      @font-face {
        font-family: Exo;
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/exo/v25/4UaZrEtFpBI4f1ZSIK9d4LjJ4o0wCwM.ttf")
          format("truetype");
      }

      /* Palette, radii and spacing follow the lobby's dark theme: a #1a1a1a
         page, #2a2a2a surfaces outlined with a 1px #444 border, a subtle 6px
         radius and 2px gutters between the rounded panels. */
      :root {
        --bg: #1a1a1a;
        --surface: #2a2a2a;
        --border: #444;
        --border-light: #333;
        --hover: #444;
        --text: #e0e0e0;
        --muted: #aaa;
        --accent: #6ba3f5;

        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;

        /* Gutter between the panel and the viewport, matching the lobby's
           inset content column. */
        padding: 0 1rem 1rem;
        background: var(--bg);
        color: var(--text);
        font-family: Exo, system-ui, sans-serif;
        font-weight: 200;
        font-size: 15px;
      }

      header {
        flex: 0 0 auto;
        padding: 0.4rem 0.2rem;
      }

      h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
      }

      header p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      /* Title and panel share one centred, width-capped column so the layout
         reads like the lobby page rather than edge-to-edge. */
      header,
      main {
        width: 100%;
        max-width: min(80rem, 100%);
        margin-inline: auto;
      }

      main {
        flex: 1 1 auto;
        display: flex;
        gap: 2px;
        min-height: 0;
        padding: 2px;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      #list {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        gap: 2px;
        width: 16rem;
        margin: 0;
        padding: 2px;
        overflow-y: auto;
        list-style: none;
        background: var(--surface);
      }

      #list li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem;
        padding: 6px 10px;
        border: 1px solid var(--border-light);
        border-radius: 4px;
        color: var(--muted);
        font-size: 0.82rem;
        cursor: pointer;
      }

      #list li:hover {
        background: var(--hover);
        color: var(--text);
      }

      #list li.active {
        background: var(--hover);
        box-shadow: inset 3px 0 0 var(--accent);
        color: var(--text);
      }

      #list li .hall {
        flex: 1 1 auto;
        min-width: 0;
      }

      #list li b {
        display: block;
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 600;
      }

      /* Japanese name and ward on one muted metadata line. */
      #list li .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        color: var(--muted);
      }

      /* Progress star: hollow by default, filled once the hall is marked
         visited, which the localStorage record below applies on load. */
      #list li .star {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1;
      }

      #list li .star::before {
        content: "☆";
      }

      #list li.is-visited .star::before {
        content: "★";
        color: var(--accent);
      }

      /* Selected halls unfold to reveal the rest of the entry. Basis 100%
         wraps the block onto its own line under the name and star. */
      #list li .details {
        display: none;
        flex: 1 0 100%;
        grid-template-columns: auto 1fr;
        gap: 2px 0.5rem;
        margin: 0;
        padding-top: 4px;
        border-top: 1px solid var(--border-light);
        font-size: 0.75rem;
        line-height: 1.35;
      }

      #list li.active .details {
        display: grid;
      }

      #list li .details dt {
        color: var(--muted);
      }

      #list li .details dd {
        margin: 0;
        color: var(--text);
      }

      /* Website link in the expanded entry. URLs are long, so let them break
         anywhere rather than overflow the narrow panel. */
      #list li .details .site {
        color: var(--accent);
        overflow-wrap: anywhere;
      }

      #list li .details .site:hover {
        text-decoration: underline;
      }

      /* position: relative anchors the story panel and its link overlay, which
         are children of the map container rather than Leaflet panes. */
      #map {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        border-radius: 4px;
      }

      .leaflet-container {
        background: var(--bg);
        font-family: inherit;
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: var(--hover);
        color: var(--text);
        box-shadow: none;
      }

      .leaflet-popup-content-wrapper {
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .leaflet-popup-content {
        margin: 8px 12px;
        font-size: 0.82rem;
      }

      /* Permanent name labels beside the markers. Leaflet's tooltip defaults to
         a white chip; recolour it to sit on the dark tiles. */
      .leaflet-tooltip.hall-label,
      .leaflet-tooltip.station-label {
        padding: 1px 5px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        box-shadow: none;
        font-size: 0.75rem;
      }

      /* direction:auto flips labels left or right, so recolour both arrows. */
      .leaflet-tooltip-left.hall-label::before,
      .leaflet-tooltip-left.station-label::before {
        border-left-color: var(--bg);
      }

      .leaflet-tooltip-right.hall-label::before,
      .leaflet-tooltip-right.station-label::before {
        border-right-color: var(--bg);
      }

      /* The halls are what the page is about, so their labels carry the same
         accent blue as the hall dots. On the label background that is 6.78:1,
         comfortably above the 4.5:1 WCAG AA threshold for body text. */
      .leaflet-tooltip.hall-label {
        color: var(--accent);
      }

      /* The line's stations are context rather than the point of the page, so
         they stay muted against the blue hall labels. */
      .leaflet-tooltip.station-label {
        font-size: 0.7rem;
        color: var(--muted);
      }

      /* Hall markers are HTML divIcons rather than L.circleMarker: Leaflet
         scales a vector renderer's container during the zoom animation, so a
         SVG shape balloons on the way to max zoom and snaps back at the end. A
         marker icon is only repositioned, so the star keeps its size the whole
         way. The box is the largest star, so the anchor stays centred while
         the star grows from 18px to 21px.

         The star is the same ☆/★ progress pair as the side list: hollow until
         the club has been visited. Filled is reserved for a completed
         challenge, so the selected state only grows and whitens the hollow
         star — see the is-visited rules below. */
      .hall-dot {
        display: grid;
        place-items: center;
        color: var(--accent);
      }

      .hall-dot::before {
        content: "☆";
        font-size: 18px;
        line-height: 1;
      }

      .hall-dot.is-chosen::before {
        content: "☆";
        color: #fff;
        font-size: 21px;
      }

      /* Filled star, the same is-visited hook the side list uses. Both rules
         are listed so the filled glyph cannot depend on rule order. */
      .hall-dot.is-visited::before,
      .hall-dot.is-visited.is-chosen::before {
        content: "★";
      }

      /* Station dots reuse the constant-size divIcon trick the hall dots use,
         drawn in the line's yellow-green. */
      .station-dot {
        border: 1px solid var(--bg);
        border-radius: 50%;
        background: #9acd32;
      }

      /* Story panel for the selected club: pinned to the map's bottom right,
         clear of Leaflet's attribution. Hidden until a club is selected,
         which puts has-selection on the map container. Clubs without a story
         still get the panel — a title and the play button. */
      #story {
        position: absolute;
        right: 10px;
        bottom: 26px;
        z-index: 810;
        display: none;
        width: 18rem;
        max-width: calc(100% - 20px);
        max-height: 45%;
        overflow-y: auto;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: rgb(26 26 26 / 92%);
      }

      #story h2 {
        margin: 0 0 3px;
        color: var(--accent);
        font-size: 0.82rem;
        font-weight: 600;
      }

      #story p {
        margin: 0;
        color: var(--text);
        font-size: 0.78rem;
        line-height: 1.4;
      }

      /* The panel's one call to action, so it takes the accent fill and the
         panel's full width. Measured 7.1:1 for the dark label on the accent
         blue, well clear of the 4.5:1 WCAG AA threshold. */
      #story-play {
        display: block;
        margin-top: 8px;
        padding: 7px 10px;
        border-radius: 6px;
        background: var(--accent);
        color: #0f1620;
        font-size: 0.78rem;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
      }

      #story-play:hover,
      #story-play:focus-visible {
        background: #8ab6f8;
      }

      /* Bezier link from the panel back to the club's dot. It draws above the
         markers but under Leaflet's labels, and never eats a map drag. */
      #story-link {
        position: absolute;
        inset: 0;
        z-index: 620;
        display: none;
        overflow: visible;
        pointer-events: none;
      }

      #story-link path {
        fill: none;
        stroke: var(--accent);
        stroke-dasharray: 5 4;
        stroke-width: 1.5;
      }

      #story-link circle {
        fill: var(--accent);
      }

      #map.has-selection #story,
      #map.has-selection #story-link {
        display: block;
      }

      /* Leaflet's chrome defaults to light; darken it to sit on the dark tiles. */
      .leaflet-control-attribution {
        background: rgb(26 26 26 / 80%);
        color: var(--muted);
      }

      .leaflet-control-attribution a {
        color: var(--accent);
      }

      .leaflet-bar a {
        background: var(--surface);
        border-bottom-color: var(--border);
        color: var(--text);
      }

      .leaflet-bar a:hover {
        background: var(--hover);
      }

      /* Scoped to the prose: the play button above is a link too, and must not
         inherit the accent link colour onto its accent background. It sits
         after the Leaflet chrome on purpose: every `a` rule in this sheet
         needs ascending specificity (stylelint no-descending-specificity). */
      #story p a {
        color: var(--accent);
      }

      @media (width <= 700px) {
        body {
          padding: 0 0.5rem 0.5rem;
        }

        main {
          flex-direction: column;
        }

        #list {
          width: 100%;
          max-height: 40%;
        }
      }
    </style>
  </head>

          tags: ["Koto", "Kameido", "Three-Cushion", "Carom", "Pocket"],
        },
      ]

      // The Yamanote line, baked from OpenStreetMap (relation 1972920, the outer
      // loop) rather than fetched at runtime, so the page stays static and the
      // public OSM API is not hit on every page view. The relation concatenates
      // cleanly: 223 route ways, 904 points, no gaps, and the loop closes on
      // itself. Douglas-Peucker at ~0.0002 degrees leaves these 63 points.
      const yamanoteLine = [
        [35.62865, 139.73851],
        [35.62506, 139.7387],
        [35.61964, 139.73726],
        [35.61854, 139.7367],
        [35.61744, 139.7354],
        [35.61688, 139.73358],
        [35.61697, 139.73173],
        [35.61767, 139.73025],
        [35.62693, 139.72297],
        [35.62808, 139.72144],
        [35.62979, 139.71784],
        [35.63068, 139.71685],
        [35.63183, 139.71628],
        [35.63825, 139.71465],
        [35.65018, 139.70815],
        [35.65802, 139.70159],
        [35.65984, 139.70117],
        [35.67022, 139.70237],
        [35.67608, 139.70397],
        [35.67844, 139.70375],
        [35.68152, 139.70292],
        [35.68946, 139.70016],
        [35.6925, 139.69997],
        [35.69518, 139.69934],
        [35.70323, 139.70044],
        [35.72121, 139.70641],
        [35.73195, 139.71185],
        [35.73368, 139.71328],
        [35.7345, 139.71527],
        [35.73461, 139.71732],
        [35.73112, 139.7308],
        [35.73105, 139.73349],
        [35.7376, 139.74951],
        [35.74027, 139.75483],
        [35.74048, 139.75685],
        [35.73943, 139.75931],
        [35.73514, 139.76429],
        [35.72879, 139.76955],
        [35.7254, 139.77389],
        [35.72061, 139.77905],
        [35.71953, 139.77969],
        [35.71835, 139.77972],
        [35.71735, 139.7793],
        [35.71425, 139.77662],
        [35.71142, 139.7748],
        [35.70843, 139.77491],
        [35.70146, 139.77346],
        [35.69588, 139.77269],
        [35.68198, 139.76689],
        [35.6774, 139.76533],
        [35.67602, 139.76442],
        [35.67298, 139.76073],
        [35.66856, 139.7582],
        [35.66728, 139.758],
        [35.66333, 139.75858],
        [35.6613, 139.75856],
        [35.65155, 139.75599],
        [35.64985, 139.75491],
        [35.64846, 139.75328],
        [35.64501, 139.74624],
        [35.64328, 139.74385],
        [35.63066, 139.73867],
        [35.62865, 139.73851],
      ]

      // The line's stations in route order: [English name, Japanese name, lat,
      // lng], read from the relation's stop nodes.
      const yamanoteStations = [
        ["Shinagawa", "品川", 35.62865, 139.73851],
        ["Osaki", "大崎", 35.61947, 139.72866],
        ["Gotanda", "五反田", 35.62622, 139.72356],
        ["Meguro", "目黒", 35.63406, 139.71567],
        ["Ebisu", "恵比寿", 35.6464, 139.7101],
        ["Shibuya", "渋谷", 35.65802, 139.70159],
        ["Harajuku", "原宿", 35.67022, 139.70237],
        ["Yoyogi", "代々木", 35.68394, 139.70199],
        ["Shinjuku", "新宿", 35.68896, 139.70029],
        ["Shin-Ōkubo", "新大久保", 35.7013, 139.70019],
        ["Takadanobaba", "高田馬場", 35.7127, 139.70359],
        ["Mejiro", "目白", 35.72121, 139.70641],
        ["Ikebukuro", "池袋", 35.73026, 139.71095],
        ["Otsuka", "大塚", 35.73173, 139.72861],
        ["Sugamo", "巣鴨", 35.73346, 139.7394],
        ["Komagome", "駒込", 35.73662, 139.74722],
        ["Tabata", "田端", 35.73738, 139.76172],
        ["Nishi-Nippori", "西日暮里", 35.73222, 139.7667],
        ["Nippori", "日暮里", 35.72799, 139.77043],
        ["Uguisudani", "鶯谷", 35.72171, 139.77793],
        ["Ueno", "上野", 35.71358, 139.77614],
        ["Okachimachi", "御徒町", 35.70695, 139.77465],
        ["Akihabara", "秋葉原", 35.69836, 139.77306],
        ["Kanda", "神田", 35.69177, 139.77101],
        ["Tokyo", "東京", 35.68124, 139.76661],
        ["Yurakucho", "有楽町", 35.67494, 139.76306],
        ["Shimbashi", "新橋", 35.66616, 139.75814],
        ["Hamamatsucho", "浜松町", 35.65511, 139.75708],
        ["Tamachi", "田町", 35.64572, 139.7477],
        ["Takanawa Gateway", "高輪ゲートウェイ", 35.63541, 139.74064],
      ]

      // Markers are HTML divIcons (see .hall-dot) so the star keeps a constant
      // pixel size while the map zooms; a scaled vector shape would balloon.
      // The icon is the selected size, keeping the anchor centred as it grows.
      const dotIcon = L.divIcon({
        className: "hall-dot",
        iconSize: [21, 21],
        iconAnchor: [10.5, 10.5],
      })

      // CARTO's free API key serves raster tiles up to zoom 18; deeper tiles
      // return HTTP 403 ("Forbidden: raster tiles are available up to zoom 18").
      const maxTileZoom = 18

      const map = L.map("map", { maxZoom: maxTileZoom }).setView(
        [35.6895, 139.6917],
        12
      )

      // CARTO "Dark Matter" tiles, so the map matches the dark page. The
      // keyless dark_all URL only returns a watermark placeholder, hence the key.
      L.tileLayer(
        "https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png?key=cb1_4e2d_1_2f1763bbc5441acd7eb62607",
        {
          maxZoom: maxTileZoom,
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
        }
      ).addTo(map)

      // The line draws in Leaflet's overlay pane, below the marker pane the
      // dots live in, so the halls stay on top and keep their clicks.
      L.polyline(yamanoteLine, {
        color: "#9acd32",
        opacity: 0.6,
        weight: 3,
      }).addTo(map)

      // Station dots are divIcons for the same reason as the hall dots: Leaflet
      // scales an SVG renderer during the zoom animation, so a circleMarker
      // would balloon on the way to max zoom. One icon serves all 30 markers.
      const stationDot = L.divIcon({
        className: "station-dot",
        iconSize: [9, 9],
        iconAnchor: [4.5, 4.5],
      })

      yamanoteStations.forEach(function (station) {
        L.marker([station[2], station[3]], { icon: stationDot })
          .addTo(map)
          .bindTooltip(station[0] + " " + station[1], {
            permanent: true,
            direction: "right",
            offset: [6, 0],
            className: "station-label",
          })
      })

      const list = document.getElementById("list")
      const markers = {}

      // The panel and its link live in the map container rather than in a
      // Leaflet pane, so the panes can animate underneath without moving them.
      const storyPanel = document.getElementById("story")
      const storyTitle = document.getElementById("story-title")
      const storyText = document.getElementById("story-text")
      const storyPlayName = document.getElementById("story-play-name")
      const storyPlay = document.getElementById("story-play")
      const storyLink = document.getElementById("story-link")
      const storyPath = storyLink.querySelector("path")
      const storyTip = storyLink.querySelector("circle")

      // The club whose panel is on screen, or null before anything is picked.
      let selectedHall = null

      // A cubic bezier from the club's dot to the top edge of the panel. It
      // leaves the dot horizontally and arrives vertically, so it reads as a
      // connector rather than a straight line across the map.
      function drawStoryLink() {
        if (!selectedHall) {
          return
        }
        const point = map.latLngToContainerPoint([
          selectedHall.lat,
          selectedHall.lng,
        ])
        const box = map.getContainer().getBoundingClientRect()
        const panel = storyPanel.getBoundingClientRect()
        const x = panel.left - box.left + panel.width / 2
        const y = panel.top - box.top
        const dx = x - point.x
        const dy = y - point.y

        storyPath.setAttribute(
          "d",
          `M ${point.x} ${point.y} C ${point.x + dx * 0.5} ${point.y} ${x} ${y - dy * 0.5} ${x} ${y}`
        )
        storyTip.setAttribute("cx", point.x)
        storyTip.setAttribute("cy", point.y)
      }

      // The dot travels with the map while the panel stays put, so the curve is
      // recomputed on every change of view. The end events matter too: the last
      // step of a flyTo is a CSS zoom animation, under which a fresh
      // latLngToContainerPoint would not match the dot on screen.
      map.on("move zoom viewreset resize moveend zoomend", drawStoryLink)

      function select(id, pan) {
        list.querySelectorAll("li").forEach(function (item) {
          item.classList.toggle("active", item.dataset.id === id)
        })
        Object.keys(markers).forEach(function (mid) {
          markers[mid].getElement().classList.toggle("is-chosen", mid === id)
        })

        const item = list.querySelector('li[data-id="' + id + '"]')
        if (item) {
          item.scrollIntoView({ block: "nearest" })
        }

        const hall = halls.find(function (h) {
          return h.id === id
        })

        // Every club opens the panel: the title and the play button are always
        // useful, so a club without a story simply gets no prose between them.
        selectedHall = hall
        map.getContainer().classList.add("has-selection")
        storyTitle.textContent = hall.name
        // Stories are local, trusted data and may carry a link, so they are
        // rendered as HTML rather than text — empty for a club without one.
        storyText.innerHTML = hall.story || ""
        storyPlayName.textContent = hall.japaneseName
        // Launch a three-cushion race sized for this club. The club id rides
        // along so the game can hand it straight back (?club=) and the star
        // can be filled when the race target is reached; clubName is the label
        // the game puts on the wall plaque as "player @ club" (Japanese name,
        // the club's own signage), and custom.emoji forces the wall portrait's
        // flag to Japan instead of the browser locale's.
        storyPlay.href =
          "./index.html?ruletype=threecushion&raceTo=" +
          hall.raceTo +
          "&club=" +
          encodeURIComponent(hall.id) +
          "&clubName=" +
          encodeURIComponent(hall.japaneseName) +
          "&custom.emoji=" +
          encodeURIComponent("\u{1F1EF}\u{1F1F5}")
        drawStoryLink()

        if (pan) {
          map.flyTo([hall.lat, hall.lng], maxTileZoom, { duration: 0.8 })
          markers[id].openPopup()
        }
      }

      // A cleared club comes back from the game as ?club=<id>&won=1 on this
      // page's URL. The ids are persisted so every completed club keeps its
      // filled star on later visits.
      const STORAGE_KEY = "map:visited"
      const query = new URLSearchParams(window.location.search)
      const visited = new Set()
      try {
        JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]").forEach(
          function (id) {
            visited.add(id)
          }
        )
      } catch (e) {
        console.log("map: could not read visited clubs", e)
      }
      if (query.get("won") === "1" && query.get("club")) {
        visited.add(query.get("club"))
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(visited)))
        } catch (e) {
          console.log("map: could not save visited clubs", e)
        }
      }

      halls.forEach(function (hall) {
        const item = document.createElement("li")
        item.dataset.id = hall.id
        item.innerHTML = `
          <span class="hall">
            <b>${hall.name}</b>
            <span class="meta">
              <span lang="ja">${hall.japaneseName}</span>
              <span>${hall.district}</span>
            </span>
          </span>
          <span class="star" aria-hidden="true"></span>
          <dl class="details">
            <dt>Address</dt>
            <dd>${hall.address}</dd>
            <dt>Race to</dt>
            <dd>${hall.raceTo} points</dd>
            <dt>Website</dt>
            <dd>
              <a
                class="site"
                href="${hall.website}"
                target="_blank"
                rel="noopener"
                >${hall.website}</a
              >
            </dd>
          </dl>
        `
        item.addEventListener("click", function () {
          select(hall.id, true)
        })
        // The hollow/filled star pair is the progress hook: both the side-list
        // row and the map marker fill once the club's challenge is completed.
        // `visited` holds every club id recorded in localStorage above.
        hall.visited = visited.has(hall.id)
        item.classList.toggle("is-visited", Boolean(hall.visited))
        list.appendChild(item)

        const marker = L.marker([hall.lat, hall.lng], { icon: dotIcon })
          .addTo(map)
          .bindPopup(
            `<b>${hall.name}</b><br><span lang="ja">${hall.japaneseName}</span>`
          )
          .bindTooltip(`<span lang="ja">${hall.japaneseName}</span>`, {
            permanent: true,
            direction: "auto",
            offset: [10, 0],
            className: "hall-label",
            // Leaflet gives tooltips pointer-events:none; interactive opts the
            // label back in as a click target (Leaflet's own CSS supplies the
            // pointer cursor). Station labels stay inert — context, not links.
            interactive: true,
          })
        // Clicking the dot zooms to it, same as clicking its row in the panel.
        marker.addEventListener("click", function () {
          select(hall.id, true)
        })
        // The permanent name label is part of the hall's click target too: it
        // sits beside the dot and reads as the club's name on the map. The
        // element only exists because the tooltip is permanent and the marker
        // is already on the map, hence the optional call.
        const label = marker.getTooltip()?.getElement?.()
        if (label) {
          label.addEventListener("click", function () {
            select(hall.id, true)
          })
        }
        // Fill the map star for a completed club, the marker's half of the same
        // visited state the row above carries.
        const star = marker.getElement()
        if (star) {
          star.classList.toggle("is-visited", Boolean(hall.visited))
        }
        markers[hall.id] = marker
      })

      // Hand focus back to the club the game was started from, so its panel and
      // (on a win) its freshly filled star are on screen immediately.
      const returnClub = query.get("club")
      if (
        returnClub &&
        halls.some(function (h) {
          return h.id === returnClub
        })
      ) {
        select(returnClub, true)
      }
    </script>
  </body>
</html>
