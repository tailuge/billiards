<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tokyo billiards challenge</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin
    ></script>

    <style>
      @font-face {
        font-family: Exo;
        font-style: normal;
        font-weight: 200;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/exo/v25/4UaZrEtFpBI4f1ZSIK9d4LjJ4tM3CwM.ttf")
          format("truetype");
      }

      @font-face {
        font-family: Exo;
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/exo/v25/4UaZrEtFpBI4f1ZSIK9d4LjJ4o0wCwM.ttf")
          format("truetype");
      }

      :root {
        --bg: #111;
        --panel: #181818;
        --line: #2a2a2a;
        --text: #f0f0f0;
        --muted: #8a8a8a;
        --accent: #6ba3f5;

        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family: Exo, system-ui, sans-serif;
        font-weight: 200;
        font-size: 15px;
      }

      header {
        flex: 0 0 auto;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
      }

      header p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      main {
        flex: 1 1 auto;
        display: flex;
        min-height: 0;
      }

      #list {
        flex: 0 0 auto;
        width: 16rem;
        margin: 0;
        padding: 0;
        overflow-y: auto;
        list-style: none;
        border-right: 1px solid var(--line);
      }

      #list li {
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.82rem;
        cursor: pointer;
      }

      #list li:hover {
        background: var(--panel);
        color: var(--text);
      }

      #list li.active {
        background: var(--panel);
        box-shadow: inset 3px 0 0 var(--accent);
        color: var(--text);
      }

      #list li b {
        display: block;
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 600;
      }

      #map {
        flex: 1 1 auto;
        min-height: 0;
      }

      .leaflet-container {
        background: var(--bg);
        font-family: inherit;
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: var(--panel);
        color: var(--text);
        box-shadow: none;
      }

      .leaflet-popup-content {
        margin: 8px 12px;
        font-size: 0.82rem;
      }

      @media (width <= 700px) {
        main {
          flex-direction: column;
        }

        #list {
          width: 100%;
          max-height: 40%;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tokyo billiards challenge</h1>
      <p>Can you visit all the billiard halls in Tokyo?</p>
    </header>

    <main>
      <ul id="list"></ul>
      <div id="map"></div>
    </main>

    <script>
      // Billiard halls in Tokyo. Kept in full for the later game integration;
      // the list only shows the name and district.
      const halls = [
        {
          id: "matsuyama",
          name: "Matsuyama Billiards",
          japaneseName: "松山ビリヤード",
          district: "Setagaya",
          address: "2-20-14 Kitazawa, Setagaya-ku, Tokyo",
          lat: 35.6611294,
          lng: 139.6671216,
          phone: "+81 3-3412-2921",
          website: "https://maps.google.com/?cid=1431339591284776350",
          hours: "2:00 PM - 12:00 AM Daily",
          tables: "Carom / Three-Cushion & Pocket Tables",
          rating: 4.3,
          tags: ["Setagaya", "Shimokitazawa", "Three-Cushion", "Carom"],
        },
        {
          id: "nabbi",
          name: "Billiard Club Nabbi",
          japaneseName: "ビリヤードクラブナビー",
          district: "Toshima",
          address: "1-18-11 Kita-Otsuka, Otsuka KY Bldg, Toshima-ku, Tokyo",
          lat: 35.732634,
          lng: 139.7306202,
          phone: "+81 3-3576-1226",
          website: "https://bc-nabbi.jimdofree.com/",
          hours: "Varies",
          tables: "Three-Cushion & Pocket Tables",
          rating: 3.5,
          tags: ["Toshima", "Otsuka", "Sugamo", "Three-Cushion"],
        },
        {
          id: "soma",
          name: "Billiard Soma",
          japaneseName: "ビリヤード相馬",
          district: "Shibuya",
          address: "1-17-1 Jingumae 3F, Shibuya-ku, Tokyo",
          lat: 35.6708,
          lng: 139.7028,
          phone: "+81 3-3401-8818",
          website: "https://www.facebook.com/443685878991152/",
          hours: "Permanently Closed",
          tables: "Carom / Three-Cushion",
          rating: 4.2,
          tags: ["Shibuya", "Harajuku", "Three-Cushion", "Closed"],
        },
      ]

      const base = {
        radius: 7,
        weight: 2,
        color: "#6ba3f5",
        fillColor: "#6ba3f5",
        fillOpacity: 0.7,
      }
      const chosen = {
        radius: 9,
        weight: 3,
        color: "#fff",
        fillColor: "#6ba3f5",
        fillOpacity: 1,
      }

      const map = L.map("map").setView([35.6895, 139.6917], 12)

      L.tileLayer(
        "https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_4e2d_1_2f1763bbc5441acd7eb62607",
        {
          maxZoom: 20,
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
        }
      ).addTo(map)

      const list = document.getElementById("list")
      const markers = {}

      function select(id, pan) {
        list.querySelectorAll("li").forEach(function (item) {
          item.classList.toggle("active", item.dataset.id === id)
        })
        Object.keys(markers).forEach(function (mid) {
          markers[mid].setStyle(mid === id ? chosen : base)
        })

        const item = list.querySelector('li[data-id="' + id + '"]')
        if (item) {
          item.scrollIntoView({ block: "nearest" })
        }

        if (pan) {
          const hall = halls.find(function (h) {
            return h.id === id
          })
          map.flyTo([hall.lat, hall.lng], 15, { duration: 0.8 })
          markers[id].openPopup()
        }
      }

      halls.forEach(function (hall) {
        const item = document.createElement("li")
        item.dataset.id = hall.id
        item.innerHTML =
          "<b>" + hall.name + "</b><span>" + hall.district + "</span>"
        item.addEventListener("click", function () {
          select(hall.id, true)
        })
        list.appendChild(item)

        const marker = L.circleMarker([hall.lat, hall.lng], base)
          .addTo(map)
          .bindPopup("<b>" + hall.name + "</b><br>" + hall.japaneseName)
        marker.addEventListener("click", function () {
          select(hall.id, false)
        })
        markers[hall.id] = marker
      })
    </script>
  </body>
</html>
