<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tokyo billiards challenge</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin
    ></script>

    <style>
      @font-face {
        font-family: Exo;
        font-style: normal;
        font-weight: 200;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/exo/v25/4UaZrEtFpBI4f1ZSIK9d4LjJ4tM3CwM.ttf")
          format("truetype");
      }

      @font-face {
        font-family: Exo;
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url("https://fonts.gstatic.com/s/exo/v25/4UaZrEtFpBI4f1ZSIK9d4LjJ4o0wCwM.ttf")
          format("truetype");
      }

      /* Palette, radii and spacing follow the lobby's dark theme: a #1a1a1a
         page, #2a2a2a surfaces outlined with a 1px #444 border, a subtle 6px
         radius and 2px gutters between the rounded panels. */
      :root {
        --bg: #1a1a1a;
        --surface: #2a2a2a;
        --border: #444;
        --border-light: #333;
        --hover: #444;
        --text: #e0e0e0;
        --muted: #aaa;
        --accent: #6ba3f5;

        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;

        /* Gutter between the panel and the viewport, matching the lobby's
           inset content column. */
        padding: 0 1rem 1rem;
        background: var(--bg);
        color: var(--text);
        font-family: Exo, system-ui, sans-serif;
        font-weight: 200;
        font-size: 15px;
      }

      header {
        flex: 0 0 auto;
        padding: 0.4rem 0.2rem;
      }

      h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
      }

      header p {
        margin: 3px 0 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      /* Title and panel share one centred, width-capped column so the layout
         reads like the lobby page rather than edge-to-edge. */
      header,
      main {
        width: 100%;
        max-width: min(80rem, 100%);
        margin-inline: auto;
      }

      main {
        flex: 1 1 auto;
        display: flex;
        gap: 2px;
        min-height: 0;
        padding: 2px;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      #list {
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        gap: 2px;
        width: 16rem;
        margin: 0;
        padding: 2px;
        overflow-y: auto;
        list-style: none;
        background: var(--surface);
      }

      #list li {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem;
        padding: 6px 10px;
        border: 1px solid var(--border-light);
        border-radius: 4px;
        color: var(--muted);
        font-size: 0.82rem;
        cursor: pointer;
      }

      #list li:hover {
        background: var(--hover);
        color: var(--text);
      }

      #list li.active {
        background: var(--hover);
        box-shadow: inset 3px 0 0 var(--accent);
        color: var(--text);
      }

      #list li .hall {
        flex: 1 1 auto;
        min-width: 0;
      }

      #list li b {
        display: block;
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 600;
      }

      /* Japanese name and ward on one muted metadata line. */
      #list li .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        color: var(--muted);
      }

      /* Progress star: hollow by default, filled once the hall is marked
         visited. Nothing sets .is-visited yet, so every hall starts empty. */
      #list li .star {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1;
      }

      #list li .star::before {
        content: "☆";
      }

      #list li.is-visited .star::before {
        content: "★";
        color: var(--accent);
      }

      /* Selected halls unfold to reveal the rest of the entry. Basis 100%
         wraps the block onto its own line under the name and star. */
      #list li .details {
        display: none;
        flex: 1 0 100%;
        grid-template-columns: auto 1fr;
        gap: 2px 0.5rem;
        margin: 0;
        padding-top: 4px;
        border-top: 1px solid var(--border-light);
        font-size: 0.75rem;
        line-height: 1.35;
      }

      #list li.active .details {
        display: grid;
      }

      #list li .details dt {
        color: var(--muted);
      }

      #list li .details dd {
        margin: 0;
        color: var(--text);
      }

      #map {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        border-radius: 4px;
      }

      .leaflet-container {
        background: var(--bg);
        font-family: inherit;
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        background: var(--hover);
        color: var(--text);
        box-shadow: none;
      }

      .leaflet-popup-content-wrapper {
        border: 1px solid var(--border);
        border-radius: 6px;
      }

      .leaflet-popup-content {
        margin: 8px 12px;
        font-size: 0.82rem;
      }

      /* Permanent Japanese name labels beside each marker. Leaflet's tooltip
         defaults to a white chip; recolour it to sit on the dark tiles. */
      .leaflet-tooltip.hall-label {
        padding: 1px 5px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--text);
        box-shadow: none;
        font-size: 0.75rem;
      }

      /* direction:auto flips labels left or right, so recolour both arrows. */
      .leaflet-tooltip-left.hall-label::before {
        border-left-color: var(--bg);
      }

      .leaflet-tooltip-right.hall-label::before {
        border-right-color: var(--bg);
      }

      /* Leaflet's chrome defaults to light; darken it to sit on the dark tiles. */
      .leaflet-control-attribution {
        background: rgb(26 26 26 / 80%);
        color: var(--muted);
      }

      .leaflet-control-attribution a {
        color: var(--accent);
      }

      .leaflet-bar a {
        background: var(--surface);
        border-bottom-color: var(--border);
        color: var(--text);
      }

      .leaflet-bar a:hover {
        background: var(--hover);
      }

      @media (width <= 700px) {
        body {
          padding: 0 0.5rem 0.5rem;
        }

        main {
          flex-direction: column;
        }

        #list {
          width: 100%;
          max-height: 40%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tokyo billiards challenge</h1>
      <p>Can you visit all the billiard halls in Tokyo?</p>
    </header>

    <main>
      <ul id="list"></ul>
      <div id="map"></div>
    </main>

    <script>
      // Billiard halls in Tokyo. Kept in full for the later game integration;
      // the list only shows the name and district.
      const halls = [
        {
          id: "matsuyama",
          name: "Matsuyama Billiards",
          japaneseName: "松山ビリヤード",
          district: "Setagaya",
          address: "2-20-14 Kitazawa, Setagaya-ku, Tokyo",
          lat: 35.6611294,
          lng: 139.6671216,
          phone: "+81 3-3412-2921",
          website: "https://maps.google.com/?cid=1431339591284776350",
          hours: "2:00 PM - 12:00 AM Daily",
          tables: "Carom / Three-Cushion & Pocket Tables",
          rating: 4.3,
          tags: ["Setagaya", "Shimokitazawa", "Three-Cushion", "Carom"],
        },
        {
          id: "nabbi",
          name: "Billiard Club Nabbi",
          japaneseName: "ビリヤードクラブナビー",
          district: "Toshima",
          address: "1-18-11 Kita-Otsuka, Otsuka KY Bldg, Toshima-ku, Tokyo",
          lat: 35.732634,
          lng: 139.7306202,
          phone: "+81 3-3576-1226",
          website: "https://bc-nabbi.jimdofree.com/",
          hours: "Varies",
          tables: "Three-Cushion & Pocket Tables",
          rating: 3.5,
          tags: ["Toshima", "Otsuka", "Sugamo", "Three-Cushion"],
        },
        {
          id: "soma",
          name: "Billiard Soma",
          japaneseName: "ビリヤード相馬",
          district: "Shibuya",
          address: "1-17-1 Jingumae 3F, Shibuya-ku, Tokyo",
          lat: 35.6708,
          lng: 139.7028,
          phone: "+81 3-3401-8818",
          website: "https://www.facebook.com/443685878991152/",
          hours: "Permanently Closed",
          tables: "Carom / Three-Cushion",
          rating: 4.2,
          tags: ["Shibuya", "Harajuku", "Three-Cushion", "Closed"],
        },
        {
          id: "roots",
          name: "Billiard Roots",
          japaneseName: "ビリヤード ルーツ",
          district: "Shinagawa",
          address: "1-27-7 Nishi-Gotanda, Shinagawa-ku, Tokyo",
          lat: 35.6264,
          lng: 139.7214,
          phone: "+81 3-3490-2580",
          website: "http://www.roots-billiards.com/",
          hours: "12:00 PM - 11:00 PM Daily",
          tables: "3 Carom (Three-Cushion), Pocket Tables",
          rating: 4.5,
          tags: ["Shinagawa", "Gotanda", "Three-Cushion", "Carom"],
        },
        {
          id: "kobbys",
          name: "Kobby's Billiards",
          japaneseName: "コ比ービリヤード",
          district: "Nakano",
          address: "2-24-9 Nogata, Nakano-ku, Tokyo",
          lat: 35.7198,
          lng: 139.6542,
          phone: "+81 3-3388-9211",
          website: "http://www.kobbys.jp/",
          hours: "12:00 PM - 11:30 PM Daily",
          tables: "3 Carom (Three-Cushion), 12 Pocket Tables",
          rating: 4.4,
          tags: ["Nakano", "Nogata", "Three-Cushion", "Carom"],
        },
        {
          id: "revelation",
          name: "Billiard Club Revelation",
          japaneseName: "ビリヤード リベレーション",
          district: "Shinjuku",
          address: "1-11-2 Nishi-Shinjuku, Shinjuku-ku, Tokyo",
          lat: 35.6895,
          lng: 139.697,
          phone: "+81 3-3342-9980",
          website: "http://revelation-billiards.jp/",
          hours: "1:00 PM - 11:00 PM Daily",
          tables: "2 Carom (Three-Cushion), Pocket Tables",
          rating: 4.3,
          tags: ["Shinjuku", "Three-Cushion", "Carom"],
        },
        {
          id: "alvis",
          name: "Billiard Alvis",
          japaneseName: "ビリヤード アルビス",
          district: "Koto",
          address: "2-12-8 Kameido, Koto-ku, Tokyo",
          lat: 35.6983,
          lng: 139.8251,
          phone: "+81 3-3682-1233",
          website: "http://alvis-billiards.com/",
          hours: "2:00 PM - 12:00 AM Daily",
          tables: "Carom / Three-Cushion Dedicated Tables",
          rating: 4.2,
          tags: ["Koto", "Kameido", "Three-Cushion", "Carom"],
        },
        {
          id: "sumiyoshi",
          name: "Sumiyoshi Billiards",
          japaneseName: "住吉ビリヤード",
          district: "Koto",
          address: "2-25-2 Sumiyoshi, Koto-ku, Tokyo",
          lat: 35.6891,
          lng: 139.8143,
          phone: "+81 3-3631-5588",
          website: "https://maps.google.com/?cid=1028374829103847201",
          hours: "1:00 PM - 11:00 PM Daily",
          tables: "Carom (Three-Cushion)",
          rating: 4.1,
          tags: ["Koto", "Sumiyoshi", "Three-Cushion", "Traditional"],
        },
      ]

      const base = {
        radius: 7,
        weight: 2,
        color: "#6ba3f5",
        fillColor: "#6ba3f5",
        fillOpacity: 0.7,
      }
      const chosen = {
        radius: 9,
        weight: 3,
        color: "#fff",
        fillColor: "#6ba3f5",
        fillOpacity: 1,
      }

      // CARTO's free API key serves raster tiles up to zoom 18; deeper tiles
      // return HTTP 403 ("Forbidden: raster tiles are available up to zoom 18").
      const maxTileZoom = 18

      const map = L.map("map", { maxZoom: maxTileZoom }).setView(
        [35.6895, 139.6917],
        12
      )

      // CARTO "Dark Matter" tiles, so the map matches the dark page. The
      // keyless dark_all URL only returns a watermark placeholder, hence the key.
      L.tileLayer(
        "https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png?key=cb1_4e2d_1_2f1763bbc5441acd7eb62607",
        {
          maxZoom: maxTileZoom,
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
        }
      ).addTo(map)

      const list = document.getElementById("list")
      const markers = {}

      function select(id, pan) {
        list.querySelectorAll("li").forEach(function (item) {
          item.classList.toggle("active", item.dataset.id === id)
        })
        Object.keys(markers).forEach(function (mid) {
          markers[mid].setStyle(mid === id ? chosen : base)
        })

        const item = list.querySelector('li[data-id="' + id + '"]')
        if (item) {
          item.scrollIntoView({ block: "nearest" })
        }

        if (pan) {
          const hall = halls.find(function (h) {
            return h.id === id
          })
          map.flyTo([hall.lat, hall.lng], 15, { duration: 0.8 })
          markers[id].openPopup()
        }
      }

      halls.forEach(function (hall) {
        const item = document.createElement("li")
        item.dataset.id = hall.id
        item.innerHTML = `
          <span class="hall">
            <b>${hall.name}</b>
            <span class="meta">
              <span lang="ja">${hall.japaneseName}</span>
              <span>${hall.district}</span>
            </span>
          </span>
          <span class="star" aria-hidden="true"></span>
          <dl class="details">
            <dt>Address</dt>
            <dd>${hall.address}</dd>
            <dt>Hours</dt>
            <dd>${hall.hours}</dd>
            <dt>Tables</dt>
            <dd>${hall.tables}</dd>
            <dt>Rating</dt>
            <dd>${hall.rating}</dd>
          </dl>
        `
        item.addEventListener("click", function () {
          select(hall.id, true)
        })
        list.appendChild(item)

        const marker = L.circleMarker([hall.lat, hall.lng], base)
          .addTo(map)
          .bindPopup(
            `<b>${hall.name}</b><br><span lang="ja">${hall.japaneseName}</span>`
          )
          .bindTooltip(`<span lang="ja">${hall.japaneseName}</span>`, {
            permanent: true,
            direction: "auto",
            offset: [10, 0],
            className: "hall-label",
          })
        marker.addEventListener("click", function () {
          select(hall.id, false)
        })
        markers[hall.id] = marker
      })
    </script>
  </body>
</html>
