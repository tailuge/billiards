<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cue Customiser</title>
  <style>
    :root {
      --bg: #12161d;
      --panel: rgba(18, 22, 29, 0.86);
      --panel-border: #2a323e;
      --text: #e6edf3;
      --muted: #8b95a5;
      --accent: #4a9eff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
    }
    #view { position: fixed; inset: 0; }
    #view canvas { display: block; }

    #params {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 272px;
      padding: 14px 16px 12px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
      user-select: none;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
    }
    #params h1 {
      margin: 0 0 2px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    #params .sub {
      margin: 0 0 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .group {
      border-top: 1px solid var(--panel-border);
      padding-top: 6px;
      margin-top: 10px;
    }
    #params > .group:first-of-type {
      border-top: none;
      margin-top: 0;
      padding-top: 0;
    }
    .group-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 4px 0 10px;
    }

    .swatch-row { margin-bottom: 10px; }
    .swatch-row label {
      font-size: 12px;
      color: var(--muted);
      display: block;
      margin-bottom: 5px;
    }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
    .swatch {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.18);
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .swatch:hover { transform: scale(1.2); }
    .swatch.active {
      box-shadow: 0 0 0 2px var(--accent);
      transform: scale(1.12);
    }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      margin: 10px 0 0;
      cursor: pointer;
    }
    .check input { accent-color: var(--accent); }

    #params .hint {
      margin: 12px 0 0;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--panel-border);
      padding-top: 8px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="view"></div>
  <aside id="params">
    <h1>Cue Customiser</h1>
    <p class="sub">Carom3D style &middot; Z-up &middot; port of src/view/cuemesh.ts</p>

    <div class="group">
      <div class="group-title">Finish</div>
      <div class="swatch-row" data-key="shaftColour">
        <label>Shaft colour</label><div class="swatches"></div>
      </div>
      <div class="swatch-row" data-key="buttColour">
        <label>Butt colour</label><div class="swatches"></div>
      </div>
    </div>

    <div class="group">
      <div class="group-title">Texture</div>
      <label class="check">
        <input type="checkbox" id="grain" checked /> Wood grain
      </label>
    </div>

    <label class="check">
      <input type="checkbox" id="autorotate" checked /> Auto-rotate
    </label>
    <p class="hint">Drag to orbit &middot; scroll to zoom &middot; colours apply live</p>
  </aside>

  <script type="module">
    import * as THREE from "three"
    import { OrbitControls } from "three/addons/controls/OrbitControls.js"

    // ------------------------------------------------------------------
    // Port of src/view/cuemesh.ts  (R and up taken from
    // src/model/physics/constants.ts and src/utils/three-utils.ts)
    // ------------------------------------------------------------------
    const R = 0.03275 // ball radius (m)
    const UP = new THREE.Vector3(0, 0, 1) // scene is Z-up

    // Fixed geometry (the game defaults; sliders removed on purpose)
    const GEO = {
      tip: (R * 0.07) / 0.5, // 4.585 mm
      butt: (R * 0.23) / 0.5, // 15.065 mm
      length: 1.47,
      segments: 11,
      baseTilt: 0.12,
      elevation: 0,
    }

    // Customisation state (Carom3D-style)
    const state = {
      shaftColour: "#d2b48c", // natural ash
      buttColour: "#1a1a1a", // ebony
      grain: true,
    }

    // Materials (shared singletons, mutated on rebuild)
    const shaftMat = new THREE.MeshPhongMaterial({ color: 0xd2b48c, shininess: 50 })
    const buttMat = new THREE.MeshPhongMaterial({ color: 0x1a1a1a, shininess: 80 })
    const ferruleMat = new THREE.MeshPhongMaterial({ color: 0xe5e5e5, shininess: 100 })
    const tipMat = new THREE.MeshPhongMaterial({ color: 0x4a7c9a, shininess: 5 })

    // Four-part cue (butt / shaft / ferrule / tip) built along +Y,
    // exactly as in CueMesh.cueGeometry.
    function cueGeometry(tipRadius, buttRadius, length, segments = 11) {
      const group = new THREE.Group()

      const buttLength = length * 0.28
      const shaftLength = length * 0.71
      const ferruleLength = length * 0.007

      // 1. Butt
      const butt = new THREE.Mesh(
        new THREE.CylinderGeometry(buttRadius * 0.9, buttRadius, buttLength, segments),
        buttMat
      )
      butt.position.y = -length / 2 + buttLength / 2
      group.add(butt)

      // 2. Shaft
      const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(tipRadius, buttRadius * 0.9, shaftLength, segments),
        shaftMat
      )
      shaft.position.y = butt.position.y + buttLength / 2 + shaftLength / 2
      group.add(shaft)

      // 3. Ferrule
      const ferrule = new THREE.Mesh(
        new THREE.CylinderGeometry(tipRadius, tipRadius, ferruleLength, segments),
        ferruleMat
      )
      ferrule.position.y = shaft.position.y + shaftLength / 2 + ferruleLength / 2
      group.add(ferrule)

      // 4. Tip
      const tipHeight = 0.0055
      const tip = new THREE.Mesh(
        new THREE.CylinderGeometry(tipRadius * 0.93, tipRadius, tipHeight, segments),
        tipMat
      )
      tip.position.y = ferrule.position.y + ferruleLength / 2 + tipHeight / 2
      tip.name = "cueTip"
      group.add(tip)

      return group
    }

    // Equivalent of CueMesh.createCue: rotates the cue into the X-Y plane
    // (Z-up) so it lies along X with the tip near the ball at the origin.
    function createCue(tip, but, length, segments = 11, baseTilt = 0.12) {
      const cueBody = cueGeometry(tip, but, length, segments)
      const tiltMesh = new THREE.Group()
      const mesh = new THREE.Group()

      cueBody.applyMatrix4(new THREE.Matrix4().makeRotationAxis(UP, -Math.PI / 2))
      cueBody.position.set(-length / 2 - R, 0, R * 0.12)
      tiltMesh.rotation.y = baseTilt
      tiltMesh.add(cueBody)
      mesh.add(tiltMesh)
      return { mesh, tiltMesh, cueBody }
    }

    // ------------------------------------------------------------------
    // Procedural wood grain (canvas texture, stripes along the length)
    // ------------------------------------------------------------------
    function mulberry32(a) {
      return function () {
        a |= 0
        a = (a + 0x6d2b79f5) | 0
        let t = Math.imul(a ^ (a >>> 15), 1 | a)
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296
      }
    }

    function woodGrainTexture(hex, seed = 7) {
      const w = 64
      const h = 512
      const canvas = document.createElement("canvas")
      canvas.width = w
      canvas.height = h
      const ctx = canvas.getContext("2d")

      ctx.fillStyle = hex
      ctx.fillRect(0, 0, w, h)

      // Wavy darker/lighter streaks running down the length
      const rng = mulberry32(seed)
      for (let i = 0; i < 140; i++) {
        const x = rng() * w
        const y = rng() * h
        const len = h * (0.4 + rng() * 0.6)
        ctx.strokeStyle = rng() > 0.45 ? "rgba(0,0,0,0.14)" : "rgba(255,255,255,0.07)"
        ctx.lineWidth = 0.5 + rng() * 1.6
        ctx.beginPath()
        const amp = 0.4 + rng() * 1.6
        ctx.moveTo(x, y)
        for (let yy = 0; yy < len; yy += 6) {
          ctx.lineTo(x + Math.sin(yy * (0.05 + rng() * 0.06)) * amp, y + yy)
        }
        ctx.stroke()
      }

      // Subtle vertical tonal variation
      const grad = ctx.createLinearGradient(0, 0, 0, h)
      grad.addColorStop(0, "rgba(255,255,255,0.06)")
      grad.addColorStop(0.5, "rgba(0,0,0,0.05)")
      grad.addColorStop(1, "rgba(255,255,255,0.04)")
      ctx.fillStyle = grad
      ctx.fillRect(0, 0, w, h)

      const tex = new THREE.CanvasTexture(canvas)
      tex.wrapS = THREE.RepeatWrapping
      tex.repeat.set(4, 1)
      tex.colorSpace = THREE.SRGBColorSpace
      return tex
    }

    // ------------------------------------------------------------------
    // Scene (Z-up)
    // ------------------------------------------------------------------
    const view = document.getElementById("view")
    const scene = new THREE.Scene()
    scene.up.set(0, 0, 1)
    scene.background = new THREE.Color(0x141a22)

    const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 20)
    camera.up.set(0, 0, 1)
    camera.position.set(1.5, 1.5, 2.2)

    const renderer = new THREE.WebGLRenderer({ antialias: true })
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
    renderer.setSize(window.innerWidth, window.innerHeight)
    view.appendChild(renderer.domElement)

    const controls = new OrbitControls(camera, renderer.domElement)
    controls.enableDamping = true
    controls.autoRotate = true
    controls.autoRotateSpeed = 1.2
    document.getElementById("autorotate").addEventListener("change", (e) => {
      controls.autoRotate = e.target.checked
    })

    // Lights
    scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1410, 0.9))
    const sun = new THREE.DirectionalLight(0xffffff, 2.2)
    sun.position.set(2, 3, 4)
    scene.add(sun)

    // Ground grid lying in the X-Y plane (Z is up)
    const grid = new THREE.GridHelper(6, 48, 0x3a4356, 0x232a38)
    grid.rotation.x = Math.PI / 2
    scene.add(grid)

    // Cue ball at the origin (surface touches the cue tip, as in game)
    const ball = new THREE.Mesh(
      new THREE.SphereGeometry(R, 32, 24),
      new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 90 })
    )

    // ------------------------------------------------------------------
    // Rebuild
    // ------------------------------------------------------------------
    function applyMaterials() {
      shaftMat.color.set(state.shaftColour)
      buttMat.color.set(state.buttColour)

      const shaftMap = state.grain ? woodGrainTexture(state.shaftColour) : null
      const buttMap = state.grain ? woodGrainTexture(state.buttColour, 11) : null
      if (shaftMat.map !== shaftMap) {
        shaftMat.map = shaftMap
        shaftMat.needsUpdate = true
      }
      if (buttMat.map !== buttMap) {
        buttMat.map = buttMap
        buttMat.needsUpdate = true
      }
    }

    let rig = null
    function rebuild() {
      if (rig) scene.remove(rig)
      applyMaterials()

      const { mesh, tiltMesh, cueBody } = createCue(
        GEO.tip,
        GEO.butt,
        GEO.length,
        GEO.segments,
        GEO.baseTilt
      )
      tiltMesh.rotation.y = GEO.baseTilt + GEO.elevation

      // Center the cue on the origin; ball sits at the tip, touching it.
      // (tip sits at rig-local x = -R, so the ball goes at the pivot)
      rig = new THREE.Group()
      rig.position.x = GEO.length / 2 + R
      rig.add(mesh)
      ball.position.set(0, 0, R)
      rig.add(ball)
      scene.add(rig)
    }

    // ------------------------------------------------------------------
    // Panel: swatches + toggles
    // ------------------------------------------------------------------
    const SWATCHES = {
      shaftColour: [
        "#d2b48c", // natural ash
        "#26282b", // carbon fibre
      ],
      buttColour: [
        "#1a1a1a", "#0d0d0d", "#3a2a1e", "#6e2f1f", "#5a2f1e",
        "#1f3a5f", "#6e1f1f", "#1f4a3a", "#4a2a5a",
      ],
    }

    for (const row of document.querySelectorAll(".swatch-row")) {
      const key = row.dataset.key
      const box = row.querySelector(".swatches")
      for (const hex of SWATCHES[key]) {
        const b = document.createElement("button")
        b.className = "swatch" + (hex === state[key] ? " active" : "")
        b.style.background = hex
        b.title = hex
        b.addEventListener("click", () => {
          state[key] = hex
          for (const s of box.querySelectorAll(".swatch")) {
            s.classList.toggle("active", s === b)
          }
          rebuild()
        })
        box.appendChild(b)
      }
    }

    const grainToggle = document.getElementById("grain")
    grainToggle.addEventListener("change", (e) => {
      state.grain = e.target.checked
      rebuild()
    })

    rebuild()

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight
      camera.updateProjectionMatrix()
      renderer.setSize(window.innerWidth, window.innerHeight)
    })

    function animate() {
      requestAnimationFrame(animate)
      controls.update()
      renderer.render(scene, camera)
    }
    animate()
  </script>
</body>
</html>
